<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>پشتیبانی | نت لند</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem("netland_theme");
        if (savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        } else if (savedTheme === "light") {
          document.documentElement.removeAttribute("data-theme");
        } else {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        }
      } catch (e) {}
    })();
  </script>

  <style>

    :root {

      --primary: #6d35e8;
      --primary-2: #8255f3;
      --primary-light: #f0ebff;

      --blue: #4f7cff;

      --green: #25b96f;
      --green-light: #e9f9f0;

      --orange: #f3a623;
      --orange-light: #fff3dc;

      --yellow: #ffc83d;

      --bg: #f8f8fc;
      --white: #ffffff;

      --text: #20202a;
      --text-secondary: #6f7180;
      --text-muted: #999ba8;

      --border: #ececf3;

      --shadow-sm:
        0 5px 18px rgba(40, 30, 80, 0.05);

      --shadow-md:
        0 12px 30px rgba(70, 40, 140, 0.12);

      --radius-lg: 26px;
      --radius-md: 22px;
      --radius-sm: 15px;

      --container: 1100px;

      --composer-height: 78px;
      --quick-height: 78px;

    }

    [data-theme="dark"] {
      --primary: #8b5cf6;
      --primary-2: #a78bfa;
      --primary-light: #2d1b4e;
      --blue: #60a5fa;
      --green: #34d399;
      --green-light: #1a3a2e;
      --orange: #fbbf24;
      --orange-light: #3d2e0a;
      --yellow: #fcd34d;
      --bg: #0f0f17;
      --white: #1a1a2e;
      --text: #f1f1f6;
      --text-secondary: #a1a1b5;
      --text-muted: #6b6b80;
      --border: #2a2a40;
      --shadow-sm: 0 5px 18px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.4);
    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      font-family: "Vazirmatn", sans-serif;

      background: var(--bg);

      color: var(--text);

      min-height: 100vh;

      -webkit-font-smoothing: antialiased;

      overflow-x: hidden;

      transition: background .3s ease, color .3s ease;

    }


    button,
    input,
    textarea {

      font-family: inherit;

    }


    button {

      border: none;

      cursor: pointer;

    }


    /* =====================================
       APP
    ====================================== */

    .app {

      width: 100%;

      max-width: var(--container);

      min-height: 100vh;

      margin: 0 auto;

      padding-bottom:
        calc(var(--composer-height) + var(--quick-height) + 20px);

    }


    /* =====================================
       HEADER (مثل بقیه صفحات)
    ====================================== */

    .header {
      height: 76px;
      padding: 0 22px;
      background: var(--white);
      display: grid;
      grid-template-columns: 0.9fr auto 1.5fr;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      transition: background .3s ease, border-color .3s ease;
    }

    .header-side {
      display: flex;
      align-items: center;
    }
    .header-side.left { justify-content: flex-start; }
    .header-side.right { justify-content: flex-end; }

    .icon-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: transparent;
      color: #343441;
      transition: .2s ease;
    }
    .icon-button:hover { background: #f5f3fa; color: var(--primary); }

    [data-theme="dark"] .icon-button {
      color: #c1c1d1;
    }
    [data-theme="dark"] .icon-button:hover {
      background: #2a2a40;
      color: var(--primary-2);
    }

    /* ===== لوگوی Net Land ===== */
    .netland-header-logo {
      width: 190px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: visible;
      margin-right: 38px;
    }

    .netland-logo-svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 700px) {
      .netland-header-logo {
        width: 155px;
        height: 60px;
      }
    }

    @media (max-width: 400px) {
      .netland-header-logo {
        width: 140px;
        height: 55px;
      }
    }


    main {

      padding: 0 20px;

    }


    /* =====================================
       CHAT HEADER
    ====================================== */

    .chat-header {

      margin-top: 18px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      min-height: 88px;

      border-radius: var(--radius-lg);

      padding: 15px 17px;

      display: flex;

      align-items: center;

      gap: 14px;

      color: white;

      box-shadow: var(--shadow-md);

    }


    .support-avatar {

      width: 55px;

      height: 55px;

      min-width: 55px;

      border-radius: 18px;

      background:
        rgba(255,255,255,.18);

      border:
        1px solid
        rgba(255,255,255,.28);

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .support-avatar svg {

      width: 29px;

      height: 29px;

      stroke: white;

      fill: none;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    .chat-info {

      min-width: 0;

      flex: 1;

    }


    .chat-title {

      font-size: 17px;

      font-weight: 800;

    }


    .chat-subtitle {

      margin-top: 5px;

      font-size: 10px;

      color:
        rgba(255,255,255,.78);

    }


    .chat-actions {

      display: flex;

      align-items: center;

      gap: 7px;

    }


    .chat-action {

      width: 39px;

      height: 39px;

      border-radius: 13px;

      background:
        rgba(255,255,255,.13);

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      transition: .2s ease;

    }


    .chat-action:hover {

      background:
        rgba(255,255,255,.22);

    }


    .chat-action svg {

      width: 19px;

      height: 19px;

      stroke: currentColor;

      fill: none;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    /* =====================================
       CHAT BOX
    ====================================== */

    .chat-box {

      margin-top: 12px;

      background: #f1f0f6;

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius-lg);

      overflow: hidden;

      box-shadow:
        var(--shadow-sm);

      transition: background .3s ease, border-color .3s ease;

    }

    [data-theme="dark"] .chat-box {
      background: #12121c;
    }


    /* =====================================
       MESSAGES
    ====================================== */

    .messages {

      padding: 18px 14px 22px;

      min-height: 480px;

      max-height: 560px;

      overflow-y: auto;

      background:

        radial-gradient(
          circle at 10% 10%,
          rgba(109,53,232,.035),
          transparent 35%
        ),

        radial-gradient(
          circle at 90% 80%,
          rgba(130,85,243,.035),
          transparent 35%
        ),

        #f4f3f8;

      scrollbar-width: thin;

      scrollbar-color:
        rgba(109,53,232,.25)
        transparent;

      transition: background .3s ease;

    }

    [data-theme="dark"] .messages {
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(139,92,246,.06),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(167,139,250,.06),
          transparent 35%
        ),
        #0f0f17;
    }


    .messages::-webkit-scrollbar {

      width: 5px;

    }


    .messages::-webkit-scrollbar-track {

      background: transparent;

    }


    .messages::-webkit-scrollbar-thumb {

      background:
        rgba(109,53,232,.22);

      border-radius: 20px;

    }

    [data-theme="dark"] .messages::-webkit-scrollbar-thumb {
      background: rgba(139,92,246,.35);
    }


    /* =====================================
       DATE
    ====================================== */

    .date-divider {

      display: flex;

      align-items: center;

      justify-content: center;

      margin:
        4px 0 18px;

    }


    .date-divider span {

      background:
        rgba(255,255,255,.86);

      border:
        1px solid
        rgba(236,236,243,.9);

      color: var(--text-muted);

      font-size: 10px;

      padding:
        6px 13px;

      border-radius: 30px;

      box-shadow:
        0 3px 10px
        rgba(40,30,80,.04);

      transition: background .3s ease, border-color .3s ease;
    }

    [data-theme="dark"] .date-divider span {
      background: rgba(42,42,64,.86);
      border-color: #2a2a40;
      box-shadow: 0 3px 10px rgba(0,0,0,.3);
    }


    /* =====================================
       MESSAGE ROW
    ====================================== */

    .message-row {

      display: flex;

      width: 100%;

      margin-bottom: 12px;

    }


    .message-row.support {

      justify-content: flex-start;

    }


    .message-row.user {

      justify-content: flex-end;

    }


    .message-row.admin {

      justify-content: flex-start;

    }


    .message-row.admin .message {

      background: #e8e0f5;

      border: 1px solid #d5c8f0;

      border-bottom-right-radius: 5px;

    }

    [data-theme="dark"] .message-row.admin .message {
      background: #2d1b4e;
      border-color: #3d2e6a;
    }


    .message-row.admin .message-sender {

      color: var(--primary-2);

    }


    /* =====================================
       MESSAGE
    ====================================== */

    .message {

      max-width:
        min(78%, 510px);

      padding:
        11px 13px 8px;

      border-radius: 18px;

      position: relative;

      box-shadow:
        0 3px 10px
        rgba(40,30,80,.045);

    }


    .message-row.support .message {

      background: white;

      border:
        1px solid
        var(--border);

      border-bottom-right-radius: 5px;

      transition: background .3s ease, border-color .3s ease;

    }

    [data-theme="dark"] .message-row.support .message {
      background: #1a1a2e;
      border-color: #2a2a40;
      box-shadow: 0 3px 10px rgba(0,0,0,.3);
    }


    .message-row.user .message {

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      color: white;

      border-bottom-left-radius: 5px;

    }


    .message-sender {

      font-size: 10px;

      font-weight: 700;

      color: var(--primary);

      margin-bottom: 5px;

    }


    .message-text {

      font-size: 13px;

      line-height: 2;

      word-break: break-word;

    }


    .message-row.user .message-text {

      color: white;

    }


    .message-meta {

      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 5px;

      margin-top: 3px;

      direction: ltr;

    }


    .message-time {

      font-size: 9px;

      color: var(--text-muted);

    }


    .message-row.user .message-time {

      color:
        rgba(255,255,255,.72);

    }


    .message-check {

      width: 14px;

      height: 14px;

      stroke: currentColor;

      fill: none;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    .message-row.user .message-check {

      color: #d9cbff;

    }


    /* =====================================
       FIXED QUICK QUESTIONS (بالای composer)
    ====================================== */

    .quick-wrapper {

      position: fixed;

      right: 0;

      left: 0;

      bottom: var(--composer-height);

      z-index: 89;

      display: flex;

      justify-content: center;

      pointer-events: none;

    }


    .quick-section {

      width:
        min(100%, var(--container));

      padding:
        8px 14px 10px;

      background:
        rgba(255,255,255,.97);

      border-top:
        1px solid
        var(--border);

      backdrop-filter:
        blur(14px);

      pointer-events: auto;

      transition: background .3s ease, border-color .3s ease;

    }

    [data-theme="dark"] .quick-section {
      background: rgba(26,26,46,.97);
    }


    .quick-title {

      font-size: 10px;

      color: var(--text-muted);

      margin:
        0 4px 6px;

    }


    .quick-list {

      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding:
        0 2px 2px;

      scrollbar-width: none;

    }


    .quick-list::-webkit-scrollbar {

      display: none;

    }


    .quick-btn {

      flex: 0 0 auto;

      background: white;

      border:
        1px solid
        var(--border);

      color: var(--text-secondary);

      padding:
        7px 11px;

      border-radius: 12px;

      font-size: 10px;

      transition: .2s ease;

    }

    [data-theme="dark"] .quick-btn {
      background: #1a1a2e;
      color: #a1a1b5;
    }


    .quick-btn:hover {

      border-color:
        var(--primary);

      color:
        var(--primary);

      background:
        var(--primary-light);

    }


    /* =====================================
       FIXED COMPOSER
    ====================================== */

    .composer-wrapper {

      position: fixed;

      right: 0;

      left: 0;

      bottom: 0;

      z-index: 90;

      display: flex;

      justify-content: center;

      pointer-events: none;

    }


    .composer {

      width:
        min(100%, var(--container));

      min-height:
        var(--composer-height);

      background:
        rgba(255,255,255,.97);

      border-top:
        1px solid
        var(--border);

      box-shadow:
        0 -8px 25px
        rgba(40,30,80,.07);

      padding:
        11px 20px;

      display: flex;

      align-items: flex-end;

      gap: 8px;

      pointer-events: auto;

      backdrop-filter:
        blur(14px);

      transition: background .3s ease, border-color .3s ease;

    }

    [data-theme="dark"] .composer {
      background: rgba(26,26,46,.97);
      box-shadow: 0 -8px 25px rgba(0,0,0,.4);
    }


    /* =====================================
       ATTACH BUTTON
    ====================================== */

    .attach-button {

      width: 43px;

      height: 43px;

      min-width: 43px;

      border-radius: 14px;

      background: #f7f6fb;

      color: var(--text-secondary);

      display: flex;

      align-items: center;

      justify-content: center;

      transition: .2s ease;

    }

    [data-theme="dark"] .attach-button {
      background: #2a2a40;
      color: #a1a1b5;
    }


    .attach-button:hover {

      background:
        var(--primary-light);

      color:
        var(--primary);

    }


    .attach-button svg {

      width: 20px;

      height: 20px;

      stroke: currentColor;

      fill: none;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    /* =====================================
       MESSAGE INPUT
    ====================================== */

    .input-wrap {

      flex: 1;

      min-width: 0;

      background: #f7f6fb;

      border:
        1px solid
        var(--border);

      border-radius: 16px;

      display: flex;

      align-items: center;

      padding:
        0 13px;

      transition: .2s ease;

    }

    [data-theme="dark"] .input-wrap {
      background: #2a2a40;
    }


    .input-wrap:focus-within {

      border-color:
        rgba(109,53,232,.35);

      background: white;

      box-shadow:
        0 0 0 4px
        rgba(109,53,232,.06);

    }

    [data-theme="dark"] .input-wrap:focus-within {
      background: #1a1a2e;
      border-color: rgba(139,92,246,.5);
      box-shadow: 0 0 0 4px rgba(139,92,246,.12);
    }


    .message-input {

      width: 100%;

      min-height: 43px;

      max-height: 110px;

      resize: none;

      border: none;

      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 12px;

      line-height: 1.8;

      padding:
        10px 0;

      overflow-y: auto;

    }


    .message-input::placeholder {

      color: var(--text-muted);

    }


    /* =====================================
       SEND BUTTON
    ====================================== */

    .send-button {

      width: 46px;

      height: 46px;

      min-width: 46px;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow:
        0 8px 18px
        rgba(109,53,232,.22);

      transition: .2s ease;

    }


    .send-button:hover {

      transform:
        translateY(-1px);

      box-shadow:
        0 10px 22px
        rgba(109,53,232,.28);

    }


    .send-button:active {

      transform:
        scale(.95);

    }


    .send-button svg {

      width: 20px;

      height: 20px;

      stroke: white;

      fill: none;

      stroke-width: 1.9;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    /* =====================================
       TOAST
    ====================================== */

    .toast {

      position: fixed;

      left: 50%;

      bottom:
        calc(
          var(--composer-height)
          + var(--quick-height)
          + 15px
        );

      transform:
        translateX(-50%)
        translateY(20px);

      background: #20202a;

      color: white;

      padding:
        11px 17px;

      border-radius: 13px;

      font-size: 11px;

      opacity: 0;

      pointer-events: none;

      transition: .3s ease;

      z-index: 200;

      white-space: nowrap;

    }

    [data-theme="dark"] .toast {
      background: #f1f1f6;
      color: #1a1a2e;
    }


    .toast.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);

    }


    /* =====================================
       RESPONSIVE
    ====================================== */

    @media (max-width: 700px) {

      :root {

        --composer-height: 68px;
        --quick-height: 72px;

      }


      .app {

        padding-bottom:
          calc(
            var(--composer-height)
            + var(--quick-height)
            + 15px
          );

      }


      .header {

        height: 70px;

        padding:
          0 14px;

      }


      main {

        padding:
          0 14px;

      }


      .chat-header {

        margin-top: 14px;

        border-radius: 22px;

      }


      .chat-box {

        border-radius: 22px;

      }


      .messages {

        min-height: 420px;

        max-height: 500px;

      }


      .message {

        max-width: 84%;

      }


      .composer {

        padding:
          9px 14px;

      }

      .quick-section {

        padding:
          7px 12px 8px;

      }

    }


    @media (max-width: 400px) {

      :root {

        --composer-height: 64px;
        --quick-height: 68px;

      }


      .chat-header {

        padding: 13px;

      }


      .support-avatar {

        width: 50px;

        height: 50px;

        min-width: 50px;

      }


      .chat-title {

        font-size: 15px;

      }


      .chat-subtitle {

        font-size: 9px;

      }


      .chat-actions {

        gap: 4px;

      }


      .chat-action {

        width: 34px;

        height: 34px;

        border-radius: 11px;

      }


      .message {

        max-width: 88%;

      }


      .message-text {

        font-size: 12px;

      }


      .composer {

        padding:
          7px 9px;

        gap: 6px;

      }


      .attach-button {

        width: 39px;

        height: 39px;

        min-width: 39px;

      }


      .send-button {

        width: 42px;

        height: 42px;

        min-width: 42px;

      }


      .input-wrap {

        border-radius: 14px;

      }

    }

  </style>

</head>


<body>


  <div class="app">


    <!-- =================================
         HEADER (مثل بقیه صفحات)
    ================================== -->

    <header class="header">

      <div class="header-side left">

        <button
          class="icon-button"
          type="button"
          aria-label="بازگشت"
          onclick="goBack()"
        >

          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>

        </button>

      </div>

      <!-- ===== لوگوی Net Land ===== -->
      <div class="netland-header-logo" aria-label="Net Land">
        <img 
          src="netland-logo.png"
          alt="Net Land Logo"
          class="netland-logo-svg"
          width="190"
          height="75"
        >
      </div>

      <div class="header-side right"></div>

    </header>



    <main>


      <!-- =================================
           CHAT HEADER
      ================================== -->

      <section class="chat-header">


        <div class="support-avatar">

          <svg viewBox="0 0 24 24">

            <path
              d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.2 9.2 0 0 1-4-.9L3 20l1.2-4A8.3 8.3 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"
            ></path>

            <path d="M8 10h8"></path>

            <path d="M8 14h5"></path>

          </svg>

        </div>


        <div class="chat-info">

          <div class="chat-title">
            پشتیبانی نت لند
          </div>

          <div class="chat-subtitle">
            پاسخگویی و راهنمایی کاربران
          </div>

        </div>


        <div class="chat-actions">

          <button
            class="chat-action"
            type="button"
            aria-label="سوالات متداول"
            onclick="location.href='faq.html'"
          >

            <svg viewBox="0 0 24 24">

              <circle
                cx="12"
                cy="12"
                r="9"
              ></circle>

              <path
                d="M9.8 9a2.3 2.3 0 1 1 3.9 1.6c-.9.8-1.7 1.2-1.7 2.4"
              ></path>

              <path d="M12 16.5h.01"></path>

            </svg>

          </button>

        </div>


      </section>



      <!-- =================================
           CHAT BOX (فقط پیام‌ها)
      ================================== -->

      <section class="chat-box">


        <div
          class="messages"
          id="messages"
        >


          <div class="date-divider">

            <span>
              امروز
            </span>

          </div>


          <div class="message-row support welcome-message">

            <div class="message">

              <div class="message-sender">
                پشتیبانی نت لند
              </div>

              <div class="message-text">

                سلام، به پشتیبانی نت لند خوش آمدید.
                اگر در استفاده از طرح‌ها یا جشنواره‌ها
                مشکلی دارید، سوال خود را برای ما ارسال کنید.

              </div>

              <div class="message-meta">

                <span class="message-time">
                  ۱۰:۳۰
                </span>

              </div>

            </div>

          </div>


        </div>


      </section>


    </main>

  </div>



  <!-- =================================
       FIXED QUICK QUESTIONS (بالای composer)
  ================================== -->

  <div class="quick-wrapper">

    <div class="quick-section">

      <div class="quick-title">
        سوالات سریع
      </div>


      <div class="quick-list">


        <button
          class="quick-btn"
          type="button"
          data-message="در دریافت جایزه یا پاداش طرح مشکل دارم."
        >
          مشکل در دریافت پاداش
        </button>


        <button
          class="quick-btn"
          type="button"
          data-message="می‌خواهم درباره یک جشنواره اطلاعات بیشتری دریافت کنم."
        >
          اطلاعات جشنواره
        </button>


        <button
          class="quick-btn"
          type="button"
          data-message="در نحوه انجام یکی از طرح‌ها نیاز به راهنمایی دارم."
        >
          راهنمای انجام طرح
        </button>


        <button
          class="quick-btn"
          type="button"
          data-message="یک مشکل دیگر دارم و نیاز به راهنمایی دارم."
        >
          مشکل دیگر
        </button>


      </div>

    </div>

  </div>



  <!-- =================================
       FIXED MESSAGE COMPOSER
  ================================== -->

  <div class="composer-wrapper">


    <div class="composer">


      <!-- ATTACH -->

      <button
        class="attach-button"
        type="button"
        aria-label="پیوست"
        onclick="showToast('امکان ارسال فایل در نسخه فعلی فعال نیست')"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="M21.4 11.6l-8.9 8.9a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 1 1-2.8-2.8l8.4-8.4"
          ></path>

        </svg>

      </button>



      <!-- INPUT -->

      <div class="input-wrap">

        <textarea
          id="messageInput"
          class="message-input"
          rows="1"
          placeholder="پیام خود را بنویسید..."
          aria-label="متن پیام"
        ></textarea>

      </div>



      <!-- SEND (مثل تلگرام - بالا-راست) -->

      <button
        class="send-button"
        type="button"
        id="sendButton"
        aria-label="ارسال پیام"
      >

        <svg viewBox="0 0 24 24">

          <path d="M2 21L23 12L2 3L2 10L17 12L2 14L2 21Z"></path>

        </svg>

      </button>


    </div>

  </div>



  <!-- TOAST -->

  <div
    class="toast"
    id="toast"
  ></div>



  <script src="js/api-config.js"></script>


  <script>

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const toast =
      document.getElementById("toast");

    let userId = null;
    let userName = null;


    function getUserId() {
      let id = localStorage.getItem('netland_user_id');
      if (!id) {
        id = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('netland_user_id', id);
      }
      return id;
    }

    function getUserName() {
      let name = localStorage.getItem('netland_username');
      if (!name) {
        name = 'کاربر مهمان';
      }
      return name;
    }


    async function loadMessages() {
      try {
        const userMessages = await getUserSupportMessages(userId);
        
        const existingMessages = messages.querySelectorAll('.message-row:not(.welcome-message)');
        existingMessages.forEach(el => el.remove());
        
        userMessages.sort((a, b) => {
          const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
          const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
          return dateA - dateB;
        });
        
        userMessages.forEach(msg => {
          if (msg.isAdmin === true || msg.repliedBy === 'admin') {
            appendMessage('admin', msg.message || msg.reply, msg.createdAt || msg.repliedAt, 'پشتیبانی نت لند');
          } else {
            appendMessage('user', msg.message, msg.createdAt);
            
            if (msg.reply || msg.replyText) {
              const replyText = msg.reply || msg.replyText;
              appendMessage('admin', replyText, msg.repliedAt || msg.createdAt, 'پشتیبانی نت لند');
            }
          }
        });

        scrollToBottom();

      } catch (error) {
        console.warn('⚠️ خطا در خواندن پیام‌ها:', error);
      }
    }


    function appendMessage(type, text, time, senderName) {

      const row = document.createElement("div");
      row.className = "message-row " + type;

      const bubble = document.createElement("div");
      bubble.className = "message";

      if (type === 'support' || type === 'admin') {
        const sender = document.createElement("div");
        sender.className = "message-sender";
        sender.textContent = senderName || 'پشتیبانی نت لند';
        bubble.appendChild(sender);
      }

      const textElement = document.createElement("div");
      textElement.className = "message-text";
      textElement.textContent = text;
      bubble.appendChild(textElement);

      const meta = document.createElement("div");
      meta.className = "message-meta";

      const timeEl = document.createElement("span");
      timeEl.className = "message-time";
      
      if (time && typeof time === 'string') {
        try {
          const date = new Date(time);
          if (!isNaN(date.getTime())) {
            timeEl.textContent = date.toLocaleTimeString('fa-IR', {
              hour: '2-digit',
              minute: '2-digit'
            });
          } else {
            timeEl.textContent = time;
          }
        } catch {
          timeEl.textContent = time;
        }
      } else if (time && time.seconds) {
        timeEl.textContent = new Date(time.seconds * 1000).toLocaleTimeString('fa-IR', {
          hour: '2-digit',
          minute: '2-digit'
        });
      } else {
        timeEl.textContent = getCurrentTime();
      }
      
      meta.appendChild(timeEl);

      if (type === 'user') {
        const check = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        check.setAttribute("class", "message-check");
        check.setAttribute("viewBox", "0 0 24 24");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M4 12l4 4L20 4");
        check.appendChild(path);
        meta.appendChild(check);
      }

      bubble.appendChild(meta);
      row.appendChild(bubble);
      messages.appendChild(row);

    }


    async function sendMessage(text) {

      const message = (text || messageInput.value).trim();
      if (!message) return;

      appendMessage('user', message, getCurrentTime());
      messageInput.value = "";
      autoResize();
      scrollToBottom();

      try {
        await sendSupportMessage(getUserId(), getUserName(), message);
        console.log('✅ پیام ارسال شد!');
        
        setTimeout(() => loadMessages(), 2000);

      } catch (error) {
        console.warn('⚠️ خطا در ارسال پیام:', error);
        showToast('❌ خطا در ارسال پیام');
      }

    }


    function getCurrentTime() {

      const now = new Date();
      return now.toLocaleTimeString("fa-IR", {
        hour: "2-digit",
        minute: "2-digit"
      });

    }


    sendButton.addEventListener("click", function () {
      sendMessage();
    });


    messageInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });


    function autoResize() {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 110) + "px";
    }

    messageInput.addEventListener("input", autoResize);


    document.querySelectorAll(".quick-btn").forEach(function (button) {
      button.addEventListener("click", function () {
        const text = button.dataset.message;
        sendMessage(text);
      });
    });


    function scrollToBottom() {
      setTimeout(function () {
        messages.scrollTop = messages.scrollHeight;
      }, 100);
    }


    let toastTimer;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove("show");
      }, 2500);
    }


    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    }


    userId = getUserId();
    userName = getUserName();

    loadMessages();
    console.log('🔥 پشتیبانی به Cloudflare Worker متصل شد!');
    console.log('👤 کاربر:', userName, '(', userId, ')');

    autoResize();
    scrollToBottom();

    setInterval(function() {
      loadMessages();
    }, 10000);

  </script>


</body>

</html>
