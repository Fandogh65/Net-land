<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>جزئیات جشنواره | نت لند</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #6d35e8;
      --primary-2: #8255f3;
      --primary-light: #f0ebff;
      --blue: #4f7cff;
      --green: #25b96f;
      --green-light: #e9f9f0;
      --orange: #f3a623;
      --orange-light: #fff3dc;
      --yellow: #ffc83d;
      --bg: #f8f8fc;
      --white: #ffffff;
      --text: #20202a;
      --text-secondary: #6f7180;
      --text-muted: #999ba8;
      --border: #ececf3;
      --shadow-sm: 0 5px 18px rgba(40, 30, 80, 0.05);
      --shadow-md: 0 12px 30px rgba(70, 40, 140, 0.12);
      --radius-lg: 26px;
      --radius-md: 22px;
      --radius-sm: 15px;
      --container: 1100px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Vazirmatn", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    /* ===== HEADER ===== */
    .header {
      height: 76px;
      padding: 0 22px;
      background: var(--white);
      display: grid;
      grid-template-columns: 0.8fr auto 1.5fr;
      align-items: center;
      position: relative;
      z-index: 20;
    }

    .header-side {
      display: flex;
      align-items: center;
    }

    .header-side.left {
      justify-content: flex-start;
    }

    .header-side.right {
      justify-content: flex-end;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: transparent;
      color: #343441;
      transition: .2s ease;
    }

    .icon-button:hover {
      background: #f5f3fa;
      color: var(--primary);
    }

    /* ===== لوگوی جدید Net Land ===== */
    .netland-header-logo {
      width: 190px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: visible;
    }

    .netland-logo-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 700px) {
      .netland-header-logo {
        width: 155px;
        height: 60px;
      }
    }

    @media (max-width: 400px) {
      .netland-header-logo {
        width: 140px;
        height: 55px;
      }
    }

    main {
      padding: 0 20px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 23px 0 15px;
    }

    .page-heading h1 {
      color: var(--text);
      font-size: 22px;
      font-weight: 800;
    }

    .page-heading p {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .festival-image-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .festival-image {
      width: 112px;
      height: 112px;
      display: block;
      object-fit: cover;
      border-radius: 22px;
      background: var(--primary-light);
      border: 1px solid #e8defc;
      box-shadow: var(--shadow-md);
    }

    .festival-image-placeholder {
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #e8defc;
      box-shadow: var(--shadow-sm);
    }

    .festival-image-placeholder svg {
      width: 38px;
      height: 38px;
    }

    .detail-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 17px;
      box-shadow: var(--shadow-sm);
    }

    .detail-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .detail-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .detail-icon.green {
      background: var(--green-light);
      color: var(--green);
    }

    .detail-icon.orange {
      background: var(--orange-light);
      color: var(--orange);
    }

    .detail-icon svg {
      width: 21px;
      height: 21px;
    }

    .detail-card-title {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .duration-box {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 15px;
      border-radius: var(--radius-sm);
      background: #faf9ff;
      border: 1px solid #eee9fb;
    }

    .duration-box svg {
      flex: 0 0 20px;
      color: var(--primary);
    }

    .duration-text {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .information-text {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 2;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .referral-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border-radius: var(--radius-sm);
      background: #faf9ff;
      border: 1px solid #eee9fb;
    }

    .referral-code {
      min-width: 0;
      flex: 1;
      direction: ltr;
      text-align: center;
      color: var(--primary);
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 9px 6px;
      overflow-wrap: anywhere;
    }

    .copy-button {
      min-width: 84px;
      height: 42px;
      padding: 0 13px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 700;
      transition: .2s ease;
    }

    .copy-button:hover {
      background: var(--primary-2);
      transform: translateY(-1px);
    }

    .copy-button.copied {
      background: var(--green);
    }

    .no-referral {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .join-button {
      width: 100%;
      min-height: 56px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 15px;
      background: linear-gradient(145deg, var(--primary), var(--primary-2));
      color: white;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 22px rgba(109, 53, 232, .22);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .join-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 27px rgba(109, 53, 232, .28);
    }

    .join-button:active {
      transform: translateY(0);
    }

    .join-button.disabled {
      background: #d8d8e2;
      color: #777986;
      box-shadow: none;
      cursor: not-allowed;
    }

    .bottom-nav-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .bottom-nav {
      width: min(var(--container), 100%);
      height: 82px;
      padding: 8px 25px calc(8px + env(safe-area-inset-bottom));
      background: white;
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -7px 25px rgba(30,20,70,.07);
      display: grid;
      grid-template-columns: repeat(4,1fr);
      align-items: center;
      pointer-events: auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #858693;
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
      height: 100%;
      transition: .2s ease;
      background: transparent;
    }

    .nav-item:hover {
      color: var(--primary);
    }

    .nav-icon {
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-item.active .nav-icon {
      width: 46px;
      height: 42px;
      border-radius: 15px;
      color: white;
      background: var(--primary);
      box-shadow: 0 7px 17px rgba(109,53,232,.28);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 102px;
      transform: translateX(-50%) translateY(12px);
      z-index: 9999;
      padding: 11px 18px;
      border-radius: 14px;
      background: #20202a;
      color: white;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width:700px) {

      .app {
        max-width: 100%;
      }

      .header {
        height: 70px;
      }

      main {
        padding: 0 20px;
      }

      .page-heading {
        margin-top: 20px;
      }

      .festival-image,
      .festival-image-placeholder {
        width: 104px;
        height: 104px;
      }

      .detail-card {
        padding: 15px;
      }

      .bottom-nav {
        padding-left: 12px;
        padding-right: 12px;
      }

    }

    @media (max-width:400px) {

      .header {
        padding: 0 14px;
      }

      main {
        padding: 0 14px;
      }

      .page-heading h1 {
        font-size: 20px;
      }

      .festival-image,
      .festival-image-placeholder {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }

      .referral-box {
        flex-direction: column;
        align-items: stretch;
      }

      .copy-button {
        width: 100%;
      }

    }

    @supports (padding-bottom:env(safe-area-inset-bottom)) {
      .app {
        padding-bottom: calc(110px + env(safe-area-inset-bottom));
      }
    }
  </style>

</head>

<!-- =========================
     API Config (اتصال به Cloudflare Worker)
========================= -->

<script src="js/api-config.js"></script>

<script>

  let currentFestival = null;

  /* =========================
     شناسه جشنواره از URL
  ========================= */

  function getFestivalId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id") || null;
  }

  /* =========================
     دریافت جشنواره از Worker
  ========================= */

  async function loadFestivalFromWorker() {
    const festivalId = getFestivalId();

    if (!festivalId) {
      showToast("❌ شناسه جشنواره مشخص نیست");
      return;
    }

    try {
      const festival = await getFestivalById(festivalId);

      if (!festival) {
        showToast("❌ جشنواره پیدا نشد");
        return;
      }

      console.log('✅ جشنواره پیدا شد:', festival.title);
      renderFestival(festival);

    } catch (error) {
      console.error('❌ خطا:', error);
      showToast("❌ خطا در بارگذاری جشنواره");
    }
  }

  /* =========================
     نمایش اطلاعات جشنواره (اصلاح‌شده)
  ========================= */

  function renderFestival(festival) {
    currentFestival = festival;

    const title = festival.title || "جشنواره";
    document.title = title + " | نت لند";
    document.getElementById("festivalTitle").textContent = title;

    // ===== تصویر (اصلاح‌شده) =====
    const image = document.getElementById("festivalImage");
    const placeholder = document.getElementById("festivalImagePlaceholder");

    if (festival.image) {
      image.src = festival.image;
      image.alt = title;
      image.style.display = 'block';
      placeholder.style.display = 'none';
      image.onerror = function() {
        image.style.display = 'none';
        placeholder.style.display = 'flex';
      };
    } else {
      image.style.display = 'none';
      placeholder.style.display = 'flex';
    }

    // ===== مدت زمان =====
    const duration = document.getElementById("durationText");

    if (festival.durationType === "date" && festival.endDate) {
      duration.textContent = "تا تاریخ " + formatPersianDate(festival.endDate);
    } else if (festival.durationType === "limited") {
      duration.textContent = "محدود";
    } else {
      duration.textContent = festival.meta || "نامعلوم";
    }

    // ===== اطلاعات جشنواره =====
    document.getElementById("festivalInformation").textContent = 
      festival.information || festival.description || "اطلاعاتی برای این جشنواره ثبت نشده است.";

    // ===== کد معرف =====
    const referralBox = document.getElementById("referralBox");
    const referralCode = document.getElementById("referralCode");
    const noReferral = document.getElementById("noReferral");

    if (festival.referralCode) {
      referralCode.textContent = festival.referralCode;
      referralBox.hidden = false;
      noReferral.hidden = true;
    } else {
      referralBox.hidden = true;
      noReferral.hidden = false;
    }

    // ===== دکمه شرکت =====
    const joinButton = document.getElementById("joinButton");

    if (festival.status === "inactive") {
      joinButton.disabled = true;
      joinButton.classList.add("disabled");
      joinButton.querySelector("span").textContent = "جشنواره فعال نیست";
    } else {
      joinButton.disabled = false;
      joinButton.classList.remove("disabled");
      joinButton.querySelector("span").textContent = "شرکت در جشنواره";
    }
  }

  /* =========================
     تاریخ فارسی
  ========================= */

  function formatPersianDate(dateString) {
    if (!dateString) return "نامعلوم";
    const date = new Date(dateString + "T00:00:00");
    if (isNaN(date.getTime())) return dateString;
    try {
      return new Intl.DateTimeFormat("fa-IR", {
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(date);
    } catch {
      return dateString;
    }
  }

  /* =========================
     کپی کد معرف
  ========================= */

  function copyReferralCode() {
    if (!currentFestival || !currentFestival.referralCode) return;

    const code = currentFestival.referralCode;
    const button = document.getElementById("copyButton");

    function success() {
      button.textContent = "کپی شد ✓";
      button.classList.add("copied");
      showToast("✅ کد معرف کپی شد");
      setTimeout(() => {
        button.textContent = "کپی کد";
        button.classList.remove("copied");
      }, 1800);
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(code).then(success).catch(() => fallbackCopy(code, success));
    } else {
      fallbackCopy(code, success);
    }
  }

  function fallbackCopy(text, success) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try {
      document.execCommand("copy");
      success();
    } catch {
      showToast("کپی کردن کد انجام نشد");
    }
    textarea.remove();
  }

  /* =========================
     شرکت در جشنواره
  ========================= */

  function joinFestival() {
    if (!currentFestival) return;

    if (currentFestival.status === "inactive") {
      showToast("⚠️ این جشنواره فعال نیست");
      return;
    }

    if (!currentFestival.link) {
      showToast("⚠️ لینک شرکت ثبت نشده است");
      return;
    }

    window.location.href = currentFestival.link;
  }

  /* =========================
     اشتراک‌گذاری
  ========================= */

  async function shareFestival() {
    const data = {
      title: currentFestival?.title || "جشنواره نت لند",
      text: "مشاهده اطلاعات جشنواره در نت لند",
      url: window.location.href
    };

    if (navigator.share) {
      try {
        await navigator.share(data);
        return;
      } catch {}
    }

    try {
      await navigator.clipboard.writeText(window.location.href);
      showToast("🔗 لینک صفحه کپی شد");
    } catch {
      showToast("امکان اشتراک‌گذاری وجود ندارد");
    }
  }

  /* =========================
     بازگشت
  ========================= */

  function goBack() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "festivals.html";
    }
  }

  /* =========================
     Toast
  ========================= */

  let toastTimer;

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 1800);
  }

  /* =========================
     شروع
  ========================= */

  document.addEventListener("DOMContentLoaded", function() {
    loadFestivalFromWorker();
  });

</script>
