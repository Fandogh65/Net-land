<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>جزئیات جشنواره | نت لند</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script>
    // ============================================
    // ===== اعمال خودکار تم ذخیره‌شده (ضد فلش) =====
    // ============================================
    (function() {
      try {
        const savedTheme = localStorage.getItem("netland_theme");
        if (savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        } else if (savedTheme === "light") {
          document.documentElement.removeAttribute("data-theme");
        } else {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --primary: #6d35e8;
      --primary-2: #8255f3;
      --primary-light: #f0ebff;
      --blue: #4f7cff;
      --green: #25b96f;
      --green-light: #e9f9f0;
      --orange: #f3a623;
      --orange-light: #fff3dc;
      --yellow: #ffc83d;
      --bg: #f8f8fc;
      --white: #ffffff;
      --text: #20202a;
      --text-secondary: #6f7180;
      --text-muted: #999ba8;
      --border: #ececf3;
      --shadow-sm: 0 5px 18px rgba(40, 30, 80, 0.05);
      --shadow-md: 0 12px 30px rgba(70, 40, 140, 0.12);
      --radius-lg: 26px;
      --radius-md: 22px;
      --radius-sm: 15px;
      --container: 1100px;
    }

    [data-theme="dark"] {
      --primary: #8b5cf6;
      --primary-2: #a78bfa;
      --primary-light: #2d1b4e;
      --blue: #60a5fa;
      --green: #34d399;
      --green-light: #1a3a2e;
      --orange: #fbbf24;
      --orange-light: #3d2e0a;
      --yellow: #fcd34d;
      --bg: #0f0f17;
      --white: #1a1a2e;
      --text: #f1f1f6;
      --text-secondary: #a1a1b5;
      --text-muted: #6b6b80;
      --border: #2a2a40;
      --shadow-sm: 0 5px 18px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Vazirmatn", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background .3s ease, color .3s ease;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .header {
      height: 76px;
      padding: 0 22px;
      background: var(--white);
      display: grid;
      grid-template-columns: 0.9fr auto 1.5fr;
      align-items: center;
      position: relative;
      z-index: 20;
      transition: background .3s ease;
    }

    .header-side {
      display: flex;
      align-items: center;
    }

    .header-side.left {
      justify-content: flex-start;
    }

    .header-side.right {
      justify-content: flex-end;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: transparent;
      color: #343441;
      transition: .2s ease;
    }

    .icon-button:hover {
      background: #f5f3fa;
      color: var(--primary);
    }

    [data-theme="dark"] .icon-button {
      color: #c1c1d1;
    }

    [data-theme="dark"] .icon-button:hover {
      background: #2a2a40;
      color: var(--primary-2);
    }

    .netland-header-logo {
      width: 190px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: visible;
      margin-right: 38px;
    }

    .netland-logo-svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 700px) {
      .netland-header-logo {
        width: 155px;
        height: 60px;
      }
    }

    @media (max-width: 400px) {
      .netland-header-logo {
        width: 140px;
        height: 55px;
      }
    }

    main {
      padding: 0 20px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 23px 0 15px;
    }

    .page-heading h1 {
      color: var(--text);
      font-size: 22px;
      font-weight: 800;
    }

    .page-heading p {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .festival-image-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .festival-image {
      width: 112px;
      height: 112px;
      display: block;
      object-fit: cover;
      border-radius: 22px;
      background: var(--primary-light);
      border: 1px solid #e8defc;
      box-shadow: var(--shadow-md);
    }

    [data-theme="dark"] .festival-image {
      border-color: #3d2e6a;
    }

    .festival-image-placeholder {
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #e8defc;
      box-shadow: var(--shadow-sm);
    }

    [data-theme="dark"] .festival-image-placeholder {
      border-color: #3d2e6a;
    }

    .festival-image-placeholder svg {
      width: 38px;
      height: 38px;
    }

    .detail-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 17px;
      box-shadow: var(--shadow-sm);
      transition: background .3s ease, border-color .3s ease;
    }

    .detail-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .detail-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .detail-icon.green {
      background: var(--green-light);
      color: var(--green);
    }

    .detail-icon.orange {
      background: var(--orange-light);
      color: var(--orange);
    }

    .detail-icon svg {
      width: 21px;
      height: 21px;
    }

    .detail-card-title {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .duration-box {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 15px;
      border-radius: var(--radius-sm);
      background: #faf9ff;
      border: 1px solid #eee9fb;
      transition: background .3s ease, border-color .3s ease;
    }

    [data-theme="dark"] .duration-box {
      background: #1e1b30;
      border-color: #2d2850;
    }

    .duration-box svg {
      flex: 0 0 20px;
      color: var(--primary);
    }

    .duration-text {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .information-text {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 2;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .referral-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border-radius: var(--radius-sm);
      background: #faf9ff;
      border: 1px solid #eee9fb;
      transition: background .3s ease, border-color .3s ease;
    }

    [data-theme="dark"] .referral-box {
      background: #1e1b30;
      border-color: #2d2850;
    }

    .referral-code {
      min-width: 0;
      flex: 1;
      direction: ltr;
      text-align: center;
      color: var(--primary);
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 9px 6px;
      overflow-wrap: anywhere;
    }

    .copy-button {
      min-width: 84px;
      height: 42px;
      padding: 0 13px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 700;
      transition: .2s ease;
    }

    .copy-button:hover {
      background: var(--primary-2);
      transform: translateY(-1px);
    }

    .copy-button.copied {
      background: var(--green);
    }

    .no-referral {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .join-button {
      width: 100%;
      min-height: 56px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 15px;
      background: linear-gradient(145deg, var(--primary), var(--primary-2));
      color: white;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 22px rgba(109, 53, 232, .22);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .join-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 27px rgba(109, 53, 232, .28);
    }

    .join-button:active {
      transform: translateY(0);
    }

    .join-button.disabled {
      background: #d8d8e2;
      color: #777986;
      box-shadow: none;
      cursor: not-allowed;
    }

    [data-theme="dark"] .join-button.disabled {
      background: #2a2a40;
      color: #6b6b80;
    }

    .bottom-nav-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .bottom-nav {
      width: min(var(--container), 100%);
      height: 82px;
      padding: 8px 25px calc(8px + env(safe-area-inset-bottom));
      background: var(--white);
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -7px 25px rgba(30,20,70,.07);
      display: grid;
      grid-template-columns: repeat(4,1fr);
      align-items: center;
      pointer-events: auto;
      transition: background .3s ease;
    }

    [data-theme="dark"] .bottom-nav {
      box-shadow: 0 -7px 25px rgba(0,0,0,.4);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #858693;
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
      height: 100%;
      transition: .2s ease;
      background: transparent;
    }

    [data-theme="dark"] .nav-item {
      color: #6b6b80;
    }

    .nav-item:hover {
      color: var(--primary);
    }

    .nav-icon {
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-item.active .nav-icon {
      width: 46px;
      height: 42px;
      border-radius: 15px;
      color: white;
      background: var(--primary);
      box-shadow: 0 7px 17px rgba(109,53,232,.28);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 102px;
      transform: translateX(-50%) translateY(12px);
      z-index: 9999;
      padding: 11px 18px;
      border-radius: 14px;
      background: #20202a;
      color: white;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      white-space: nowrap;
    }

    [data-theme="dark"] .toast {
      background: #f1f1f6;
      color: #1a1a2e;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width:700px) {

      .app {
        max-width: 100%;
      }

      .header {
        height: 76px;
      }

      main {
        padding: 0 20px;
      }

      .page-heading {
        margin-top: 20px;
      }

      .festival-image,
      .festival-image-placeholder {
        width: 104px;
        height: 104px;
      }

      .detail-card {
        padding: 15px;
      }

      .bottom-nav {
        padding-left: 12px;
        padding-right: 12px;
      }

    }

    @media (max-width:400px) {

      .header {
        padding: 0 14px;
      }

      main {
        padding: 0 14px;
      }

      .page-heading h1 {
        font-size: 20px;
      }

      .festival-image,
      .festival-image-placeholder {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }

      .referral-box {
        flex-direction: column;
        align-items: stretch;
      }

      .copy-button {
        width: 100%;
      }

    }

    @supports (padding-bottom:env(safe-area-inset-bottom)) {
      .app {
        padding-bottom: calc(110px + env(safe-area-inset-bottom));
      }
    }
  </style>

</head>

<body>

<div class="app">

  <header class="header">

    <div class="header-side left">

      <button
        class="icon-button"
        type="button"
        aria-label="بازگشت"
        onclick="goBack()"
      >

        <svg
          width="23"
          height="23"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6"/>
        </svg>

      </button>

    </div>

    <div class="brand">

      <div class="netland-header-logo" aria-label="Net Land">

        <img
          src="netland-logo.png"
          alt="Net Land Logo"
          class="netland-logo-svg"
          width="190"
          height="75"
        >

      </div>

    </div>

    <div class="header-side right"></div>

  </header>

  <main>

    <div class="page-heading">

      <div>
        <h1 id="festivalTitle">
          جشنواره
        </h1>

        <p>
          اطلاعات جشنواره
        </p>
      </div>

    </div>

    <div class="festival-image-wrap">

      <img
        id="festivalImage"
        class="festival-image"
        src=""
        alt="تصویر جشنواره"
        style="display:none;"
      >

      <div
        id="festivalImagePlaceholder"
        class="festival-image-placeholder"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="8.5" cy="9" r="1.5"/>
          <path d="m21 15-4.5-4.5L8 19"/>
        </svg>

      </div>

    </div>

    <div class="detail-list">

      <section class="detail-card">

        <div class="detail-card-header">

          <span class="detail-icon">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7v5l3.2 2"/>
            </svg>

          </span>

          <h2 class="detail-card-title">
            مدت زمان
          </h2>

        </div>

        <div class="duration-box">

          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <path d="M16 2v4"/>
            <path d="M8 2v4"/>
            <path d="M3 10h18"/>
          </svg>

          <span
            id="durationText"
            class="duration-text"
          >
            نامعلوم
          </span>

        </div>

      </section>

      <section class="detail-card">

        <div class="detail-card-header">

          <span class="detail-icon green">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 10v6"/>
              <path d="M12 7h.01"/>
            </svg>

          </span>

          <h2 class="detail-card-title">
            اطلاعات جشنواره
          </h2>

        </div>

        <p
          id="festivalInformation"
          class="information-text"
        >
          اطلاعاتی برای این جشنواره ثبت نشده است.
        </p>

      </section>

      <section class="detail-card">

        <div class="detail-card-header">

          <span class="detail-icon orange">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3.5" y="7" width="17" height="12" rx="2"/>
              <path d="M8 7V5.8A1.8 1.8 0 0 1 9.8 4h4.4A1.8 1.8 0 0 1 16 5.8V7"/>
              <path d="M3.5 11h17"/>
              <path d="M10 14h4"/>
            </svg>

          </span>

          <h2 class="detail-card-title">
            کد معرف
          </h2>

        </div>

        <div
          id="referralBox"
          class="referral-box"
        >

          <div
            id="referralCode"
            class="referral-code"
          >
            -
          </div>

          <button
            id="copyButton"
            class="copy-button"
            type="button"
            onclick="copyReferralCode()"
          >
            کپی کد
          </button>

        </div>

        <p
          id="noReferral"
          class="no-referral"
          hidden
        >
          برای این جشنواره کد معرف ثبت نشده است.
        </p>

      </section>

    </div>

    <button
      id="joinButton"
      class="join-button"
      type="button"
      onclick="joinFestival()"
    >

      <span>
        شرکت در جشنواره
      </span>

      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 12h13"/>
        <path d="m13 6 6 6-6 6"/>
      </svg>

    </button>

  </main>

</div>

<div class="bottom-nav-wrapper">

  <nav class="bottom-nav">

    <button
      class="nav-item"
      onclick="window.location.href='faq.html'"
    >

      <span class="nav-icon">

        <svg
          width="23"
          height="23"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.7c-.9.9-1.8 1.2-1.8 2.8"/>
          <path d="M12 17h.01"/>
        </svg>

      </span>

      <span>
        سوالات متداول
      </span>

    </button>

    <button
      class="nav-item"
      onclick="window.location.href='favorites.html'"
    >

      <span class="nav-icon">

        <svg
          width="23"
          height="23"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.6Z"/>
        </svg>

      </span>

      <span>
        علاقه‌مندی‌ها
      </span>

    </button>

    <button
      class="nav-item active"
      onclick="window.location.href='festivals.html'"
    >

      <span class="nav-icon">

        <svg
          width="23"
          height="23"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <!-- Clipboard -->
          <rect x="5" y="4" width="14" height="18" rx="2.5"/>

          <!-- Clip -->
          <path d="M9 4V3.5A1.5 1.5 0 0 1 10.5 2h3A1.5 1.5 0 0 1 15 3.5V4"/>

          <!-- Check -->
          <path d="m8 9 1.5 1.5L12 8"/>

          <!-- Text -->
          <path d="M13.5 9H17"/>

          <!-- Check -->
          <path d="m8 14 1.5 1.5L12 13"/>

          <!-- Text -->
          <path d="M13.5 14H16"/>

          <!-- Money coin -->
          <circle cx="17.5" cy="18" r="3.2"/>
          <path d="M17.5 16.5v3"/>

<div id="toast" class="toast"></div>

<script src="js/api-config.js"></script>

<script>

  let currentFestival = null;

  function getFestivalId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id") || null;
  }

  async function loadFestivalFromWorker() {
    const festivalId = getFestivalId();

    if (!festivalId) {
      showToast("❌ شناسه جشنواره مشخص نیست");
      return;
    }

    try {
      const festival = await getFestivalById(festivalId);

      if (!festival) {
        showToast("❌ جشنواره پیدا نشد");
        return;
      }

      console.log('✅ جشنواره پیدا شد:', festival.title);
      renderFestival(festival);

    } catch (error) {
      console.error('❌ خطا:', error);
      showToast("❌ خطا در بارگذاری جشنواره");
    }
  }

  function renderFestival(festival) {
    currentFestival = festival;

    const title = festival.title || "جشنواره";
    document.title = title + " | نت لند";
    document.getElementById("festivalTitle").textContent = title;

    const image = document.getElementById("festivalImage");
    const placeholder = document.getElementById("festivalImagePlaceholder");

    if (festival.image) {
      image.src = festival.image;
      image.alt = title;
      image.style.display = 'block';

      placeholder.style.display = 'none';

      image.onerror = function() {
        image.style.display = 'none';
        placeholder.style.display = 'flex';
      };

    } else {
      image.style.display = 'none';
      placeholder.style.display = 'flex';
    }

    const duration = document.getElementById("durationText");

    if (festival.durationType === "date" && festival.endDate) {
      duration.textContent =
        "تا تاریخ " + formatPersianDate(festival.endDate);

    } else if (festival.durationType === "limited") {
      duration.textContent = "محدود";

    } else {
      duration.textContent = festival.meta || "نامعلوم";
    }

    document.getElementById("festivalInformation").textContent =
      festival.information ||
      festival.description ||
      "اطلاعاتی برای این جشنواره ثبت نشده است.";

    const referralBox = document.getElementById("referralBox");
    const referralCode = document.getElementById("referralCode");
    const noReferral = document.getElementById("noReferral");

    if (festival.referralCode) {
      referralCode.textContent = festival.referralCode;
      referralBox.hidden = false;
      noReferral.hidden = true;

    } else {
      referralBox.hidden = true;
      noReferral.hidden = false;
    }

    const joinButton = document.getElementById("joinButton");

    if (festival.status === "inactive") {

      joinButton.disabled = true;
      joinButton.classList.add("disabled");
      joinButton.querySelector("span").textContent =
        "جشنواره فعال نیست";

    } else {

      joinButton.disabled = false;
      joinButton.classList.remove("disabled");
      joinButton.querySelector("span").textContent =
        "شرکت در جشنواره";
    }
  }

  function formatPersianDate(dateString) {

    if (!dateString) return "نامعلوم";

    const date = new Date(dateString + "T00:00:00");

    if (isNaN(date.getTime())) return dateString;

    try {

      return new Intl.DateTimeFormat("fa-IR", {
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(date);

    } catch {

      return dateString;

    }
  }

  function copyReferralCode() {

    if (!currentFestival || !currentFestival.referralCode) return;

    const code = currentFestival.referralCode;
    const button = document.getElementById("copyButton");

    function success() {

      button.textContent = "کپی شد ✓";
      button.classList.add("copied");

      showToast(".کد معرف کپی شد");

      setTimeout(() => {

        button.textContent = "کپی کد";
        button.classList.remove("copied");

      }, 1800);
    }

    if (navigator.clipboard && window.isSecureContext) {

      navigator.clipboard
        .writeText(code)
        .then(success)
        .catch(() => fallbackCopy(code, success));

    } else {

      fallbackCopy(code, success);

    }
  }

  function fallbackCopy(text, success) {

    const textarea = document.createElement("textarea");

    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();

    try {

      document.execCommand("copy");
      success();

    } catch {

      showToast("کپی کردن کد انجام نشد");

    }

    textarea.remove();
  }

  function joinFestival() {

    if (!currentFestival) return;

    if (currentFestival.status === "inactive") {

      showToast("⚠️ این جشنواره فعال نیست");
      return;

    }

    if (!currentFestival.link) {

      showToast("⚠️ لینک شرکت ثبت نشده است");
      return;

    }

    window.location.href = currentFestival.link;
  }

  function goBack() {

    if (window.history.length > 1) {

      window.history.back();

    } else {

      window.location.href = "festivals.html";

    }
  }

  let toastTimer;

  function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

      toast.classList.remove("show");

    }, 1800);
  }

  document.addEventListener("DOMContentLoaded", function() {

    loadFestivalFromWorker();

  });

</script>

</body>

</html>
