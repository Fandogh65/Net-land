<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت پشتیبانی | نت لند</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#6d35e8;
      --primary-2:#8255f3;
      --primary-light:#f0ebff;
      --blue:#4f7cff;
      --green:#25b96f;
      --green-light:#e9f9f0;
      --orange:#f3a623;
      --bg:#f8f8fc;
      --white:#fff;
      --text:#20202a;
      --text-secondary:#6f7180;
      --text-muted:#999ba8;
      --border:#ececf3;
      --shadow-sm:0 5px 18px rgba(40,30,80,.05);
      --shadow-md:0 12px 30px rgba(70,40,140,.12);
      --radius-lg:26px;
      --radius-md:22px;
      --radius-sm:15px;
      --container:1200px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%}
    body{
      font-family:"Vazirmatn",sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    button,input,textarea{font-family:inherit}
    button{border:0;cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.65}

    .app{width:100%;max-width:var(--container);min-height:100vh;margin:auto;padding-bottom:25px}

    .header{
      height:76px;
      padding:0 22px;
      background:rgba(255,255,255,.97);
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      position:sticky;
      top:0;
      z-index:100;
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(15px);
    }
    .header-side{display:flex;align-items:center}
    .header-side.left{justify-content:flex-start}
    .header-side.right{justify-content:flex-end}

    .icon-button{
      width:44px;height:44px;
      display:flex;align-items:center;justify-content:center;
      border-radius:14px;background:transparent;color:#343441;
      transition:.2s ease;
    }
    .icon-button:hover{background:#f5f3fa;color:var(--primary)}
    .icon-button svg{width:21px;height:21px}

    .brand{display:flex;align-items:center;justify-content:center;gap:10px}
    .brand-icon{
      width:42px;height:42px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:#fff;
      box-shadow:0 8px 18px rgba(109,53,232,.2);
    }
    .brand-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .brand-title{font-size:18px;font-weight:800}
    .brand-title span{color:var(--primary)}

    main{padding:20px}

    .page-title{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:16px;gap:15px;
    }
    .page-title h1{font-size:22px;font-weight:800}
    .page-title p{margin-top:5px;color:var(--text-secondary);font-size:11px}

    .online-status{
      display:flex;align-items:center;gap:7px;
      background:var(--green-light);color:var(--green);
      padding:8px 12px;border-radius:13px;font-size:10px;font-weight:700;
      white-space:nowrap;
    }
    .online-dot{
      width:7px;height:7px;border-radius:50%;background:var(--green);
      box-shadow:0 0 0 4px rgba(37,185,111,.1);
    }

    .panel{
      background:#fff;border:1px solid var(--border);
      border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;
    }
    .list-header{
      padding:16px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:12px;
    }
    .search-wrap{
      flex:1;height:46px;background:#f7f6fb;border:1px solid var(--border);
      border-radius:15px;display:flex;align-items:center;padding:0 13px;transition:.2s ease;
    }
    .search-wrap:focus-within{
      background:#fff;border-color:rgba(109,53,232,.35);
      box-shadow:0 0 0 4px rgba(109,53,232,.06);
    }
    .search-wrap svg{width:19px;height:19px;color:var(--text-muted);flex-shrink:0}
    .search-input{
      width:100%;border:none;outline:none;background:transparent;
      padding:0 9px;color:var(--text);font-size:12px;
    }
    .search-input::placeholder,.composer-input::placeholder{color:#aaaab6}

    .refresh-button{
      width:46px;height:46px;border-radius:15px;background:var(--primary-light);
      color:var(--primary);display:flex;align-items:center;justify-content:center;transition:.2s ease;
    }
    .refresh-button:hover{background:var(--primary);color:#fff}
    .refresh-button.loading svg{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .users-list{min-height:500px}
    .user-item{
      min-height:88px;padding:13px 16px;display:grid;
      grid-template-columns:52px minmax(0,1fr) auto;
      align-items:center;gap:13px;border-bottom:1px solid #f0eff5;
      cursor:pointer;transition:.18s ease;position:relative;
    }
    .user-item:hover{background:#faf9fe}
    .user-item:last-child{border-bottom:0}
    .user-item.unread-user{background:#fcfbff}
    .user-item.unread-user:hover{background:#faf8ff}

    .user-avatar{
      width:52px;height:52px;border-radius:17px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#eee7ff,#ddd1ff);
      color:var(--primary);font-size:18px;font-weight:800;
      flex-shrink:0;
    }
    .user-content{min-width:0}
    .user-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .user-name{
      font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .last-time{font-size:9px;color:var(--text-muted);flex-shrink:0}
    .last-message{
      margin-top:6px;font-size:10px;color:var(--text-secondary);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .user-item.unread-user .last-message{color:var(--text);font-weight:600}
    .user-meta{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
    .message-count{
      min-width:22px;height:22px;padding:0 6px;border-radius:20px;
      background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
      font-size:9px;font-weight:800;
    }
    .message-count.empty{visibility:hidden}
    .unread-bar{
      width:7px;height:7px;border-radius:50%;background:var(--green);
      box-shadow:0 0 0 4px rgba(37,185,111,.1);
    }
    .unread-bar.hidden{visibility:hidden}

    .empty-state{
      min-height:500px;display:flex;align-items:center;justify-content:center;
      flex-direction:column;padding:40px;text-align:center;
    }
    .empty-icon{
      width:72px;height:72px;border-radius:24px;background:var(--primary-light);
      color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:14px;
    }
    .empty-icon svg{width:34px;height:34px}
    .empty-state h3{font-size:15px;font-weight:800}
    .empty-state p{margin-top:7px;color:var(--text-muted);font-size:10px;line-height:1.8}

    .loading{
      min-height:500px;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:12px;
    }
    .loader{
      width:32px;height:32px;border:3px solid #e8e1fa;border-top-color:var(--primary);
      border-radius:50%;animation:spin .8s linear infinite;
    }
    .loading span{font-size:10px;color:var(--text-muted)}

    .chat-view{
      display:none;position:fixed;inset:0;background:var(--bg);z-index:200;
    }
    .chat-view.active{display:flex;flex-direction:column}

    .chat-header{
      height:76px;background:#fff;border-bottom:1px solid var(--border);
      box-shadow:0 5px 18px rgba(40,30,80,.05);
      display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;
    }
    .back-chat{
      width:43px;height:43px;border-radius:14px;background:#f6f4fb;color:var(--text-secondary);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .back-chat:hover{color:var(--primary);background:var(--primary-light)}
    .back-chat svg{width:21px;height:21px}

    .chat-user-avatar{
      width:45px;height:45px;border-radius:15px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:#fff;display:flex;align-items:center;justify-content:center;
      font-size:16px;font-weight:800;flex-shrink:0;
    }
    .chat-user-info{min-width:0;flex:1}
    .chat-user-name{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .chat-user-id{
      margin-top:3px;font-size:9px;color:var(--text-muted);direction:ltr;text-align:right;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .chat-tools{display:flex;gap:7px}
    .chat-tool{
      width:40px;height:40px;border-radius:13px;background:#f7f6fb;color:var(--text-secondary);
      display:flex;align-items:center;justify-content:center;
    }
    .chat-tool:hover{color:var(--primary);background:var(--primary-light)}
    .chat-tool.loading svg{animation:spin .8s linear infinite}
    .chat-tool svg{width:19px;height:19px}

    .chat-messages{
      flex:1;overflow-y:auto;
      padding:25px max(18px,calc((100vw - 1000px)/2));
      background:
        radial-gradient(circle at 10% 10%,rgba(109,53,232,.035),transparent 30%),
        radial-gradient(circle at 90% 80%,rgba(130,85,243,.035),transparent 30%),#f3f2f7;
      scrollbar-width:thin;scrollbar-color:rgba(109,53,232,.25) transparent;
    }
    .chat-messages::-webkit-scrollbar{width:5px}
    .chat-messages::-webkit-scrollbar-thumb{background:rgba(109,53,232,.22);border-radius:20px}

    .date-divider{display:flex;align-items:center;justify-content:center;margin:5px 0 20px}
    .date-divider span{
      background:rgba(255,255,255,.9);border:1px solid var(--border);color:var(--text-muted);
      font-size:9px;padding:6px 13px;border-radius:30px;
    }

    .message-row{width:100%;display:flex;margin-bottom:12px}
    /* در RTL: کاربر راست و ادمین چپ */
    .message-row.user{justify-content:flex-start}
    .message-row.admin{justify-content:flex-end}

    .message{
      max-width:min(72%,600px);padding:10px 13px 8px;border-radius:18px;
      box-shadow:0 3px 10px rgba(40,30,80,.045);position:relative;
    }
    .message-row.user .message{
      background:#fff;border:1px solid var(--border);border-bottom-right-radius:5px;
    }
    .message-row.admin .message{
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:#fff;border-bottom-left-radius:5px;
    }
    .message-sender{font-size:9px;font-weight:800;margin-bottom:5px}
    .message-row.user .message-sender{color:var(--primary)}
    .message-row.admin .message-sender{color:rgba(255,255,255,.8)}
    .message-text{font-size:12px;line-height:1.95;word-break:break-word;white-space:pre-wrap}
    .message-meta{
      margin-top:3px;display:flex;align-items:center;justify-content:flex-start;
      gap:5px;direction:ltr;
    }
    .message-time{font-size:8px;color:var(--text-muted)}
    .message-row.admin .message-time{color:rgba(255,255,255,.7)}
    .check{
      width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;
    }
    .message-row.admin .check{color:#dfd2ff}

    .chat-composer{
      min-height:76px;background:rgba(255,255,255,.97);border-top:1px solid var(--border);
      box-shadow:0 -8px 25px rgba(40,30,80,.07);
      padding:10px max(18px,calc((100vw - 1000px)/2));
      display:flex;align-items:flex-end;gap:8px;flex-shrink:0;
    }
    .composer-input-wrap{
      flex:1;min-width:0;background:#f7f6fb;border:1px solid var(--border);
      border-radius:16px;padding:0 13px;display:flex;align-items:center;
    }
    .composer-input-wrap:focus-within{
      background:#fff;border-color:rgba(109,53,232,.35);
      box-shadow:0 0 0 4px rgba(109,53,232,.06);
    }
    .composer-input{
      width:100%;min-height:44px;max-height:120px;resize:none;outline:none;border:none;
      background:transparent;font-size:12px;line-height:1.8;padding:10px 0;
      overflow-y:auto;
    }
    .send-button{
      width:47px;height:47px;min-width:47px;border-radius:15px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 8px 18px rgba(109,53,232,.22);transition:.2s ease;
    }
    .send-button:hover:not(:disabled){transform:translateY(-1px)}
    .send-button:active:not(:disabled){transform:scale(.95)}
    .send-button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .chat-empty{
      height:100%;min-height:300px;display:flex;align-items:center;justify-content:center;
      flex-direction:column;color:var(--text-muted);gap:8px;
    }
    .chat-empty svg{width:42px;height:42px;color:#cfc7e6}
    .chat-empty span{font-size:10px}

    .toast{
      position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);
      background:#20202a;color:#fff;padding:11px 17px;border-radius:13px;font-size:10px;
      opacity:0;pointer-events:none;transition:.3s ease;z-index:9999;white-space:nowrap;
      max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:700px){
      .header{height:68px;padding:0 12px}
      main{padding:14px}
      .page-title{align-items:flex-start}
      .page-title h1{font-size:19px}
      .online-status{padding:7px 9px}
      .user-item{
        grid-template-columns:48px minmax(0,1fr) auto;
        padding:12px 13px;gap:10px;
      }
      .user-avatar{width:48px;height:48px}
      .chat-header{height:68px;padding:0 10px;gap:8px}
      .back-chat{width:39px;height:39px}
      .chat-user-avatar{width:40px;height:40px}
      .chat-user-name{font-size:12px}
      .chat-tools{display:none}
      .chat-messages{padding:18px 10px}
      .message{max-width:84%}
      .message-text{font-size:11px}
      .chat-composer{min-height:67px;padding:8px 10px}
      .send-button{width:43px;height:43px;min-width:43px}
      .composer-input-wrap{border-radius:14px}
    }

    @media(max-width:400px){
      .brand-title{font-size:16px}
      .brand-icon{width:37px;height:37px}
      .page-title p{font-size:9px}
      .message{max-width:89%}
    }
  </style>
</head>

<body>
<div class="app">
  <header class="header">
    <div class="header-side left">
      <button class="icon-button" onclick="goBack()" aria-label="بازگشت">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 5h16v10a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/>
          <path d="m8 10 2 2 4-4"/>
        </svg>
      </div>
      <div class="brand-title">نت <span>لند</span></div>
    </div>

    <div class="header-side right"></div>
  </header>

  <main>
    <div class="page-title">
      <div>
        <h1>مدیریت پشتیبانی</h1>
        <p>پیام‌های کاربران و پاسخگویی</p>
      </div>

      <div class="online-status">
        <span class="online-dot"></span>
        آنلاین
      </div>
    </div>

    <section class="panel">
      <div class="list-header">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </svg>
          <input id="searchInput" class="search-input" type="text" placeholder="جستجوی نام کاربر یا شناسه..." autocomplete="off">
        </div>

        <button class="refresh-button" id="refreshButton" onclick="loadAllUsers(true)" aria-label="بروزرسانی">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8.1 8.1 0 0 0-15.5-3"/>
            <path d="M4 4v4h4"/>
            <path d="M4 13a8.1 8.1 0 0 0 15.5 3"/>
            <path d="M20 20v-4h-4"/>
          </svg>
        </button>
      </div>

      <div class="users-list" id="usersList">
        <div class="loading">
          <div class="loader"></div>
          <span>در حال دریافت پیام‌ها...</span>
        </div>
      </div>
    </section>
  </main>
</div>

<section class="chat-view" id="chatView">
  <header class="chat-header">
    <button class="back-chat" onclick="closeChat()" aria-label="بازگشت">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>

    <div class="chat-user-avatar" id="chatAvatar">ک</div>

    <div class="chat-user-info">
      <div class="chat-user-name" id="chatUserName">کاربر</div>
      <div class="chat-user-id" id="chatUserId">user</div>
    </div>

    <div class="chat-tools">
      <button class="chat-tool" id="chatRefreshButton" onclick="refreshCurrentChat()" aria-label="بروزرسانی">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8.1 8.1 0 0 0-15.5-3"/>
          <path d="M4 4v4h4"/>
          <path d="M4 13a8.1 8.1 0 0 0 15.5 3"/>
          <path d="M20 20v-4h-4"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-composer">
    <div class="composer-input-wrap">
      <textarea id="adminInput" class="composer-input" rows="1" placeholder="پاسخ خود را بنویسید..." autocomplete="off"></textarea>
    </div>

    <button class="send-button" id="adminSendButton" onclick="sendAdminMessage()" aria-label="ارسال">
      <svg viewBox="0 0 24 24">
        <path d="M22 2 11 13"/>
        <path d="m22 2-7 20-4-9-9-4z"/>
      </svg>
    </button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="js/api-config.js"></script>

<script>
  "use strict";

  /* =========================================================
     STATE
  ========================================================= */

  let allMessages = [];
  let users = [];
  let currentUser = null;
  let refreshTimer = null;
  let listRefreshTimer = null;
  let isLoadingUsers = false;
  let isSending = false;
  let toastTimer = null;


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const usersList = document.getElementById("usersList");
  const searchInput = document.getElementById("searchInput");
  const chatView = document.getElementById("chatView");
  const chatMessages = document.getElementById("chatMessages");
  const adminInput = document.getElementById("adminInput");
  const adminSendButton = document.getElementById("adminSendButton");
  const chatUserName = document.getElementById("chatUserName");
  const chatUserId = document.getElementById("chatUserId");
  const chatAvatar = document.getElementById("chatAvatar");
  const refreshButton = document.getElementById("refreshButton");
  const chatRefreshButton = document.getElementById("chatRefreshButton");


  /* =========================================================
     API
     api-config.js خودت مستقیماً این توابع را دارد:
       getAllSupportMessages()
       sendAdminReply()
  ========================================================= */

  async function fetchAllSupportMessages() {
    if (typeof getAllSupportMessages !== "function") {
      throw new Error("تابع getAllSupportMessages در api-config.js پیدا نشد.");
    }

    const data = await getAllSupportMessages();
    return normalizeMessages(data);
  }


  async function sendAdminReplyToApi(userId, userName, message) {
    if (typeof sendAdminReply !== "function") {
      throw new Error("تابع sendAdminReply در api-config.js پیدا نشد.");
    }

    /*
     * پاسخ ادمین باید حتماً با فلگ‌های ادمین به Worker ارسال شود.
     * خود sendAdminReply در api-config.js این موارد را تنظیم می‌کند.
     */
    return await sendAdminReply(userId, userName, message);
  }


  /* =========================================================
     NORMALIZE
  ========================================================= */

  function normalizeMessages(data) {
    if (!data) return [];

    if (Array.isArray(data)) return data;
    if (Array.isArray(data.messages)) return data.messages;
    if (Array.isArray(data.data)) return data.data;
    if (Array.isArray(data.results)) return data.results;
    if (Array.isArray(data.supportMessages)) return data.supportMessages;

    return [];
  }


  function getMessageUserId(message) {
    return String(
      message?.userId ??
      message?.userID ??
      message?.uid ??
      message?.user_id ??
      message?.username ??
      "unknown"
    );
  }


  function getMessageUserName(message) {
    return (
      message?.userName ||
      message?.username ||
      message?.name ||
      message?.displayName ||
      "کاربر"
    );
  }


  function getMessageText(message) {
    return (
      message?.message ??
      message?.text ??
      message?.messageText ??
      message?.reply ??
      message?.replyText ??
      ""
    );
  }


  function isAdminMessage(message) {
    /*
     * Worker / Firestore ممکن است مقدار isAdmin را به شکل
     * boolean یا string برگرداند. هر دو حالت را پشتیبانی می‌کنیم.
     */
    const adminFlag =
      message?.isAdmin ??
      message?.is_admin ??
      message?.admin;

    const flagIsAdmin =
      adminFlag === true ||
      String(adminFlag).trim().toLowerCase() === "true" ||
      String(adminFlag).trim() === "1";

    const sender = String(message?.sender || "").trim().toLowerCase();
    const senderType = String(message?.senderType || "").trim().toLowerCase();
    const role = String(message?.role || "").trim().toLowerCase();
    const repliedBy = String(message?.repliedBy || "").trim().toLowerCase();

    return (
      flagIsAdmin ||
      sender === "admin" ||
      sender === "administrator" ||
      sender === "ادمین" ||
      senderType === "admin" ||
      senderType === "administrator" ||
      senderType === "ادمین" ||
      role === "admin" ||
      role === "administrator" ||
      role === "ادمین" ||
      repliedBy === "admin" ||
      repliedBy === "administrator" ||
      repliedBy === "ادمین"
    );
  }


  function getMessageDate(message) {
    return (
      message?.createdAt ??
      message?.created_at ??
      message?.timestamp ??
      message?.date ??
      message?.repliedAt ??
      null
    );
  }


  function dateValue(message) {
    const raw = getMessageDate(message);

    if (!raw) return 0;

    if (typeof raw === "object") {
      if (typeof raw.seconds === "number") return raw.seconds * 1000;
      if (typeof raw._seconds === "number") return raw._seconds * 1000;
      if (typeof raw.timestampValue === "string") {
        const parsedTimestamp = new Date(raw.timestampValue).getTime();
        return Number.isNaN(parsedTimestamp) ? 0 : parsedTimestamp;
      }
    }

    const value = new Date(raw).getTime();
    return Number.isNaN(value) ? 0 : value;
  }


  function formatTime(value) {
    if (!value) return "";

    let date;

    if (typeof value === "object") {
      if (typeof value.seconds === "number") {
        date = new Date(value.seconds * 1000);
      } else if (typeof value._seconds === "number") {
        date = new Date(value._seconds * 1000);
      } else {
        date = new Date(value);
      }
    } else {
      date = new Date(value);
    }

    if (Number.isNaN(date.getTime())) return String(value);

    return date.toLocaleTimeString("fa-IR", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }


  function getInitial(name) {
    if (!name) return "ک";

    return String(name)
      .trim()
      .charAt(0)
      .toUpperCase() || "ک";
  }


  /* =========================================================
     MESSAGE ID / DUPLICATE PROTECTION
  ========================================================= */

  function getMessageIdentity(message) {
    if (message?.id) {
      return `id:${message.id}`;
    }

    return [
      getMessageUserId(message),
      isAdminMessage(message) ? "admin" : "user",
      getMessageText(message),
      dateValue(message)
    ].join("|");
  }


  function dedupeMessages(messages) {
    const seen = new Set();
    const result = [];

    for (const message of messages) {
      const key = getMessageIdentity(message);

      if (seen.has(key)) continue;

      seen.add(key);
      result.push(message);
    }

    return result;
  }


  /* =========================================================
     BUILD USERS
  ========================================================= */

  function buildUsers(messages) {
    const map = new Map();

    for (const message of messages) {
      const userId = getMessageUserId(message);

      if (!map.has(userId)) {
        map.set(userId, {
          userId,
          userName: getMessageUserName(message),
          messages: [],
          unread: 0,
          lastMessage: "",
          lastDate: 0
        });
      }

      const user = map.get(userId);
      const name = getMessageUserName(message);

      if (name && name !== "کاربر") {
        user.userName = name;
      }

      user.messages.push(message);

      const time = dateValue(message);

      if (time >= user.lastDate) {
        user.lastDate = time;
        user.lastMessage = getMessageText(message);
      }
    }

    const result = Array.from(map.values());

    for (const user of result) {
      user.messages = dedupeMessages(user.messages).sort(
        (a, b) => dateValue(a) - dateValue(b)
      );

      user.unread = calculateUnread(user);
    }

    result.sort((a, b) => {
      if (b.lastDate !== a.lastDate) {
        return b.lastDate - a.lastDate;
      }

      return String(a.userName).localeCompare(
        String(b.userName),
        "fa"
      );
    });

    return result;
  }


  function calculateUnread(user) {
    let lastAdminTime = 0;
    let unread = 0;

    for (const message of user.messages) {
      const time = dateValue(message);

      if (isAdminMessage(message)) {
        if (time >= lastAdminTime) {
          lastAdminTime = time;
        }
      }
    }

    for (const message of user.messages) {
      if (isAdminMessage(message)) continue;

      const time = dateValue(message);

      if (time > lastAdminTime) {
        unread++;
      }
    }

    return unread;
  }


  /* =========================================================
     LOAD USERS
  ========================================================= */

  async function loadAllUsers(showLoading = false) {
    if (isLoadingUsers) return;

    isLoadingUsers = true;

    if (showLoading) {
      refreshButton.classList.add("loading");
    }

    try {
      const messages = await fetchAllSupportMessages();

      allMessages = dedupeMessages(messages).sort(
        (a, b) => dateValue(a) - dateValue(b)
      );

      users = buildUsers(allMessages);

      /*
       * اگر داخل چت هستیم، کاربر فعلی را از داده تازه پیدا کن.
       * unread آن کاربر در حالت باز صفر می‌ماند.
       */
      if (currentUser) {
        const updatedUser = users.find(
          user => user.userId === currentUser.userId
        );

        if (updatedUser) {
          updatedUser.unread = 0;
          currentUser = updatedUser;

          updateChatHeader();
          renderCurrentChat(false);
        }
      }

      renderUsers();

    } catch (error) {
      console.error("❌ خطا در دریافت پیام‌های پشتیبانی:", error);

      /*
       * اگر قبلاً داده داریم، آن را پاک نکن.
       * فقط Toast بده تا رفرش بعدی دوباره تلاش کند.
       */
      if (users.length) {
        showToast("بروزرسانی پیام‌ها ناموفق بود");
      } else {
        renderLoadError(error);
      }

    } finally {
      isLoadingUsers = false;
      refreshButton.classList.remove("loading");
    }
  }


  function renderLoadError(error) {
    usersList.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
          </svg>
        </div>
        <h3>دریافت پیام‌ها ناموفق بود</h3>
        <p>${escapeHtml(error?.message || "اتصال API پشتیبانی را بررسی کنید.")}</p>
      </div>
    `;
  }


  /* =========================================================
     RENDER USER LIST
  ========================================================= */

  function renderUsers() {
    const search = searchInput.value.trim().toLocaleLowerCase("fa");

    const filtered = users.filter(user => {
      if (!search) return true;

      return (
        String(user.userName).toLocaleLowerCase("fa").includes(search) ||
        String(user.userId).toLocaleLowerCase("fa").includes(search)
      );
    });

    if (!filtered.length) {
      usersList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-4-4"/>
            </svg>
          </div>
          <h3>${search ? "کاربری پیدا نشد" : "هنوز پیامی وجود ندارد"}</h3>
          <p>${search ? "نام کاربر یا شناسه را بررسی کنید." : "پیام‌های کاربران پس از ارسال اینجا نمایش داده می‌شوند."}</p>
        </div>
      `;
      return;
    }

    usersList.innerHTML = "";

    for (const user of filtered) {
      const item = document.createElement("div");
      item.className = "user-item" + (user.unread ? " unread-user" : "");
      item.addEventListener("click", () => openChat(user.userId));

      const avatar = document.createElement("div");
      avatar.className = "user-avatar";
      avatar.textContent = getInitial(user.userName);

      const content = document.createElement("div");
      content.className = "user-content";

      const top = document.createElement("div");
      top.className = "user-top";

      const name = document.createElement("div");
      name.className = "user-name";
      name.textContent = user.userName;

      const time = document.createElement("div");
      time.className = "last-time";
      time.textContent = formatTime(user.lastDate);

      top.append(name, time);

      const lastMessage = document.createElement("div");
      lastMessage.className = "last-message";
      lastMessage.textContent = user.lastMessage || "پیامی وجود ندارد";

      content.append(top, lastMessage);

      const meta = document.createElement("div");
      meta.className = "user-meta";

      const count = document.createElement("div");
      count.className = "message-count" + (user.unread ? "" : " empty");
      count.textContent = user.unread;

      const dot = document.createElement("div");
      dot.className = "unread-bar" + (user.unread ? "" : " hidden");

      meta.append(count, dot);
      item.append(avatar, content, meta);

      usersList.appendChild(item);
    }
  }


  /* =========================================================
     OPEN / CLOSE CHAT
  ========================================================= */

  function openChat(userId) {
    const user = users.find(item => item.userId === userId);

    if (!user) return;

    currentUser = user;
    currentUser.unread = 0;

    updateChatHeader();

    chatView.classList.add("active");
    document.body.style.overflow = "hidden";

    renderCurrentChat(true);
    startChatRefresh();

    /*
     * لیست پشت صفحه را هم فوراً به‌روز می‌کنیم
     * تا badge آن کاربر صفر شود.
     */
    renderUsers();

    setTimeout(() => adminInput.focus(), 100);
  }


  function closeChat() {
    currentUser = null;

    chatView.classList.remove("active");
    document.body.style.overflow = "";

    stopChatRefresh();

    adminInput.value = "";
    autoResizeAdminInput();

    loadAllUsers(false);
  }


  function updateChatHeader() {
    if (!currentUser) return;

    chatUserName.textContent = currentUser.userName || "کاربر";
    chatUserId.textContent = currentUser.userId || "unknown";
    chatAvatar.textContent = getInitial(currentUser.userName);
  }


  /* =========================================================
     RENDER CHAT
  ========================================================= */

  function renderCurrentChat(forceBottom = false) {
    if (!currentUser) return;

    const wasAtBottom =
      chatMessages.scrollHeight -
      chatMessages.scrollTop -
      chatMessages.clientHeight < 80;

    const messages = [...currentUser.messages].sort(
      (a, b) => dateValue(a) - dateValue(b)
    );

    chatMessages.innerHTML = "";

    if (!messages.length) {
      chatMessages.innerHTML = `
        <div class="chat-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.3 9.5 9.5 0 0 1-4-.9L3 20l1.4-4A8.2 8.2 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3.2a8.4 8.4 0 0 1 9 8.3Z"/>
          </svg>
          <span>هنوز پیامی در این گفتگو وجود ندارد.</span>
        </div>
      `;
      return;
    }

    let lastDateKey = "";

    for (const message of messages) {
      const timestamp = dateValue(message);
      const date = timestamp ? new Date(timestamp) : new Date();

      const dateKey = date.toLocaleDateString("fa-IR");

      if (dateKey !== lastDateKey) {
        const divider = document.createElement("div");
        divider.className = "date-divider";

        const span = document.createElement("span");
        span.textContent = getDateLabel(date);

        divider.appendChild(span);
        chatMessages.appendChild(divider);

        lastDateKey = dateKey;
      }

      appendChatMessage(message);
    }

    if (forceBottom || wasAtBottom) {
      requestAnimationFrame(() => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }
  }


  function getDateLabel(date) {
    const now = new Date();

    const today = now.toLocaleDateString("fa-IR");
    const yesterday = new Date(
      now.getTime() - 86400000
    ).toLocaleDateString("fa-IR");

    const current = date.toLocaleDateString("fa-IR");

    if (current === today) return "امروز";
    if (current === yesterday) return "دیروز";

    return current;
  }


  function appendChatMessage(message) {
    const row = document.createElement("div");
    const admin = isAdminMessage(message);

    row.className = "message-row " + (admin ? "admin" : "user");

    const bubble = document.createElement("div");
    bubble.className = "message";

    const sender = document.createElement("div");
    sender.className = "message-sender";
    sender.textContent = admin
      ? "پشتیبانی نت لند"
      : (currentUser.userName || "کاربر");

    const text = document.createElement("div");
    text.className = "message-text";
    text.textContent = getMessageText(message);

    const meta = document.createElement("div");
    meta.className = "message-meta";

    const time = document.createElement("span");
    time.className = "message-time";
    time.textContent = formatTime(getMessageDate(message));

    meta.appendChild(time);

    if (admin) {
      const check = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
      );

      check.setAttribute("class", "check");
      check.setAttribute("viewBox", "0 0 24 24");

      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      path.setAttribute("d", "M4 12l4 4L20 4");
      check.appendChild(path);
      meta.appendChild(check);
    }

    bubble.append(sender, text, meta);
    row.appendChild(bubble);
    chatMessages.appendChild(row);
  }


  /* =========================================================
     SEND ADMIN MESSAGE
  ========================================================= */

  async function sendAdminMessage() {
    if (!currentUser || isSending) return;

    const text = adminInput.value.trim();

    if (!text) return;

    isSending = true;
    adminSendButton.disabled = true;

    const userId = currentUser.userId;
    const userName = currentUser.userName;

    /*
     * پیام موقت فقط برای نمایش فوری است.
     * چون id ندارد، بعد از refresh با پیام واقعی API تکراری نمی‌شود.
     */
    const temporaryMessage = {
      __temporary: true,
      userId,
      username: userName,
      message: text,
      isAdmin: true,
      repliedBy: "admin",
      sender: "admin",
      senderType: "admin",
      role: "admin",
      createdAt: new Date().toISOString()
    };

    currentUser.messages.push(temporaryMessage);

    renderCurrentChat(true);

    adminInput.value = "";
    autoResizeAdminInput();

    try {
      await sendAdminReplyToApi(userId, userName, text);

      showToast("پیام با موفقیت ارسال شد ✓");

      /*
       * داده واقعی را دوباره از Worker می‌گیریم.
       * پیام موقت حذف می‌شود و نسخه واقعی جای آن را می‌گیرد.
       */
      await loadAllUsers(false);

    } catch (error) {
      console.error("❌ خطا در ارسال پاسخ:", error);

      if (currentUser) {
        currentUser.messages = currentUser.messages.filter(
          message => message !== temporaryMessage
        );

        renderCurrentChat(true);
      }

      showToast(
        error?.message || "ارسال پیام ناموفق بود"
      );

    } finally {
      isSending = false;
      adminSendButton.disabled = false;
      adminInput.focus();
    }
  }


  /* =========================================================
     REFRESH
  ========================================================= */

  async function refreshCurrentChat() {
    if (isLoadingUsers) return;

    chatRefreshButton.classList.add("loading");

    try {
      await loadAllUsers(false);
      showToast("پیام‌ها بروزرسانی شدند ✓");
    } finally {
      chatRefreshButton.classList.remove("loading");
    }
  }


  function startChatRefresh() {
    stopChatRefresh();

    refreshTimer = setInterval(async () => {
      if (currentUser && !isSending) {
        await loadAllUsers(false);
      }
    }, 5000);
  }


  function stopChatRefresh() {
    if (refreshTimer) {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }
  }


  function startListRefresh() {
    if (listRefreshTimer) clearInterval(listRefreshTimer);

    listRefreshTimer = setInterval(async () => {
      if (!currentUser && !isSending) {
        await loadAllUsers(false);
      }
    }, 5000);
  }


  /* =========================================================
     SEARCH
  ========================================================= */

  searchInput.addEventListener("input", renderUsers);


  /* =========================================================
     ENTER SEND
  ========================================================= */

  adminInput.addEventListener("keydown", event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey &&
      !event.isComposing
    ) {
      event.preventDefault();
      sendAdminMessage();
    }
  });


  /* =========================================================
     AUTO RESIZE
  ========================================================= */

  function autoResizeAdminInput() {
    adminInput.style.height = "auto";

    adminInput.style.height =
      Math.min(adminInput.scrollHeight, 120) + "px";
  }

  adminInput.addEventListener("input", autoResizeAdminInput);


  /* =========================================================
     BACK
  ========================================================= */

  function goBack() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "index.html";
    }
  }


  /* =========================================================
     TOAST
  ========================================================= */

  function showToast(text) {
    const toast = document.getElementById("toast");

    toast.textContent = text;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }


  /* =========================================================
     ESCAPE
  ========================================================= */

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /* =========================================================
     PAGE VISIBILITY
     وقتی تب مرورگر مخفی است، رفرش را متوقف می‌کنیم.
  ========================================================= */

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopChatRefresh();

      if (listRefreshTimer) {
        clearInterval(listRefreshTimer);
        listRefreshTimer = null;
      }

    } else {
      if (currentUser) {
        startChatRefresh();
      } else {
        startListRefresh();
      }

      loadAllUsers(false);
    }
  });


  /* =========================================================
     INITIAL
  ========================================================= */

  autoResizeAdminInput();
  loadAllUsers(true);
  startListRefresh();
</script>

</body>
