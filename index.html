<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>نت لند | Net Land</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #6d35e8;
      --primary-2: #8255f3;
      --primary-light: #f0ebff;
      --blue: #4f7cff;
      --green: #25b96f;
      --green-light: #e9f9f0;
      --orange: #f3a623;
      --orange-light: #fff3dc;
      --red: #e55353;
      --red-light: #fff0f0;
      --pink: #e83e8c;
      --pink-light: #fde8f0;
      --yellow: #ffc83d;
      --bg: #f8f8fc;
      --white: #ffffff;
      --text: #20202a;
      --text-secondary: #6f7180;
      --text-muted: #999ba8;
      --border: #ececf3;
      --shadow-sm: 0 5px 18px rgba(40, 30, 80, 0.05);
      --shadow-md: 0 12px 30px rgba(70, 40, 140, 0.12);
      --radius-lg: 26px;
      --radius-md: 22px;
      --radius-sm: 15px;
      --container: 1100px;
    }

    [data-theme="dark"] {
      --primary: #8b5cf6;
      --primary-2: #a78bfa;
      --primary-light: #2d1b4e;
      --blue: #60a5fa;
      --green: #34d399;
      --green-light: #1a3a2e;
      --orange: #fbbf24;
      --orange-light: #3d2e0a;
      --red: #f87171;
      --red-light: #3d1a1a;
      --pink: #f472b6;
      --pink-light: #3d1a2e;
      --yellow: #fcd34d;
      --bg: #0f0f17;
      --white: #1a1a2e;
      --text: #f1f1f6;
      --text-secondary: #a1a1b5;
      --text-muted: #6b6b80;
      --border: #2a2a40;
      --shadow-sm: 0 5px 18px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: "Vazirmatn", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background .3s ease, color .3s ease;
    }

    button, input { font-family: inherit; }
    button { border: 0; cursor: pointer; }
    a { text-decoration: none; color: inherit; }

    .app {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .header {
      height: 76px;
      padding: 0 22px;
      background: var(--white);
      display: grid;
      grid-template-columns: 0.9fr auto 1.5fr;
      align-items: center;
      position: relative;
      z-index: 20;
      transition: background .3s ease;
    }

    .header-side { display: flex; align-items: center; gap: 6px; }
    .header-side.left { justify-content: flex-start; }
    .header-side.right { justify-content: flex-end; }

    .icon-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: transparent;
      color: #343441;
      transition: .2s ease;
    }

    [data-theme="dark"] .icon-button {
      color: #c1c1d1;
    }

    .icon-button:hover {
      background: #f5f3fa;
      color: var(--primary);
    }

    [data-theme="dark"] .icon-button:hover {
      background: #2a2a40;
      color: var(--primary-2);
    }

    .theme-toggle {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: transparent;
      color: #343441;
      transition: .3s ease;
      position: relative;
      overflow: hidden;
    }

    .theme-toggle:hover {
      background: #f5f3fa;
      color: var(--primary);
      transform: rotate(15deg);
    }

    [data-theme="dark"] .theme-toggle {
      color: #c1c1d1;
    }

    [data-theme="dark"] .theme-toggle:hover {
      background: #2a2a40;
      color: var(--primary-2);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      transition: transform .4s ease, opacity .4s ease;
    }

    .theme-toggle .icon-sun,
    .theme-toggle .icon-moon {
      position: absolute;
      transition: transform .4s ease, opacity .4s ease;
    }

    .theme-toggle .icon-moon {
      opacity: 0;
      transform: rotate(-90deg) scale(0.5);
    }

    [data-theme="dark"] .theme-toggle .icon-sun {
      opacity: 0;
      transform: rotate(90deg) scale(0.5);
    }

    [data-theme="dark"] .theme-toggle .icon-moon {
      opacity: 1;
      transform: rotate(0) scale(1);
    }

    .notification { position: relative; }

    .notification-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      border: 2px solid var(--white);
      box-shadow: 0 3px 8px rgba(109, 53, 232, 0.35);
      pointer-events: none;
      transition: transform .2s ease, opacity .2s ease;
      z-index: 5;
    }

    [data-theme="dark"] .notification-badge {
      background: var(--primary-2);
      border-color: var(--white);
      color: #1a1a2e;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    .notification-badge[hidden] {
      display: none;
    }

    .netland-header-logo {
      width: 190px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: visible;
      margin-right: 38px;
    }

    .netland-logo-svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 700px) {
      .netland-header-logo {
        width: 155px;
        height: 60px;
      }
    }

    @media (max-width: 400px) {
      .netland-header-logo {
        width: 140px;
        height: 55px;
      }
    }

    main { padding: 0 20px; }

    .hero {
      position: relative;
      min-height: 255px;
      overflow: hidden;
      border-radius: var(--radius-lg);
      padding: 27px 28px;
      background:
        radial-gradient(circle at 85% 20%, rgba(140, 105, 255, 0.65), transparent 32%),
        linear-gradient(135deg, #5927d9 0%, #713deb 52%, #8255f3 100%);
      box-shadow: 0 14px 35px rgba(86, 42, 180, 0.18);
      display: flex;
      align-items: center;
    }

    .hero-content {
      width: 58%;
      position: relative;
      z-index: 3;
      color: white;
    }

    .hero-title {
      font-size: clamp(25px, 4vw, 34px);
      line-height: 1.35;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .hero-title .highlight { color: var(--yellow); }

    .hero-subtitle {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .hero-description {
      max-width: 410px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 13px;
      line-height: 1.8;
      margin-bottom: 18px;
    }

    .hero-button {
      min-height: 46px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border-radius: 15px;
      background: white;
      color: #6333d9;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(35, 15, 90, 0.13);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .hero-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(35, 15, 90, 0.18);
    }

    .hero-art {
      position: absolute;
      left: 25px;
      bottom: -10px;
      width: 38%;
      height: 100%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-custom-icon {
      width: 145%;
      max-width: 340px;
      height: auto;
      object-fit: contain;
      animation: heroIconFloat 4s ease-in-out infinite;
      filter: drop-shadow(0 18px 32px rgba(20, 10, 60, 0.5));
      user-select: none;
      -webkit-user-drag: none;
      position: relative;
      z-index: 2;
    }

    @keyframes heroIconFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-12px) rotate(2deg); }
    }

    .spark {
      position: absolute;
      color: var(--yellow);
      font-size: 16px;
      animation: floating 3s ease-in-out infinite;
    }

    .spark.one { top: 27px; left: 25%; }
    .spark.two { top: 55px; right: 5%; animation-delay: .8s; }
    .spark.three { bottom: 34px; left: 7%; animation-delay: 1.4s; }

    @keyframes floating {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .slider-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
    }

    .slider-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #d8d4e8;
      transition: .25s ease;
    }

    [data-theme="dark"] .slider-dot {
      background: #3a3a55;
    }

    .slider-dot.active {
      width: 20px;
      background: var(--primary);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 27px;
      margin-bottom: 14px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 21px;
      font-weight: 700;
    }

    .section-title svg { color: var(--primary); }

    .view-all {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
    }

    .festival-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .festival-card {
      position: relative;
      display: grid;
      grid-template-columns: 72px 1fr auto;
      align-items: center;
      gap: 15px;
      min-height: 132px;
      padding: 17px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition: transform .22s ease, box-shadow .22s ease, background .3s ease;
    }

    .festival-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 26px rgba(40,30,80,.08);
    }

    [data-theme="dark"] .festival-card:hover {
      box-shadow: 0 10px 26px rgba(0,0,0,.3);
    }

    .festival-icon {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .festival-icon img {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .festival-icon.green {
      background: var(--green-light);
      color: var(--green);
    }

    .festival-icon.blue {
      background: #edf2ff;
      color: var(--blue);
    }

    .festival-icon.pink {
      background: var(--pink-light);
      color: var(--pink);
    }

    .festival-icon.orange {
      background: var(--orange-light);
      color: var(--orange);
    }

    .festival-icon.red {
      background: var(--red-light);
      color: var(--red);
    }

    [data-theme="dark"] .festival-icon.blue {
      background: #1a2a4a;
    }

    .festival-content { min-width: 0; }

    .festival-badge {
      width: fit-content;
      display: inline-flex;
      padding: 5px 9px;
      margin-bottom: 6px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-green {
      color: #21a563;
      background: var(--green-light);
    }

    .badge-blue {
      color: #416bdc;
      background: #edf2ff;
    }

    .badge-pink {
      color: #c92a7a;
      background: var(--pink-light);
    }

    .badge-orange {
      color: #dc9419;
      background: var(--orange-light);
    }

    .badge-red {
      color: #c92a2a;
      background: var(--red-light);
    }

    [data-theme="dark"] .badge-blue {
      background: #1a2a4a;
      color: #60a5fa;
    }

    .festival-title {
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .festival-description {
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .festival-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .festival-meta svg { color: #8b8c98; }

    [data-theme="dark"] .festival-meta svg {
      color: var(--text-muted);
    }

    .festival-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
    }

    .festival-action {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      background: transparent;
      transition: .2s ease;
    }

    .festival-action:hover { gap: 7px; }

    .favorite-button {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #f7f6fb;
      color: #8c8d9b;
      transition: .2s ease;
    }

    [data-theme="dark"] .favorite-button {
      background: #2a2a40;
      color: #6b6b80;
    }

    .favorite-button:hover {
      background: var(--primary-light);
      color: var(--primary);
      transform: scale(1.04);
    }

    .favorite-button.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .favorite-button.active svg {
      fill: currentColor;
    }

    .feature-card {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      align-items: stretch;
      margin-top: 22px;
      padding: 18px;
      background: #f2edff;
      border-radius: var(--radius-md);
      border: 1px solid #e8defc;
      transition: background .3s ease, border-color .3s ease;
    }

    [data-theme="dark"] .feature-card {
      background: #1e1b30;
      border-color: #2d2850;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 12px;
      gap: 7px;
    }

    .feature + .feature {
      border-right: 1px solid #ddd6f2;
    }

    [data-theme="dark"] .feature + .feature {
      border-right-color: #2d2850;
    }

    .feature-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: var(--primary);
      background: white;
      transition: background .3s ease;
    }

    [data-theme="dark"] .feature-icon {
      background: #2a2a40;
    }

    .feature-title {
      font-size: 13px;
      font-weight: 700;
    }

    .feature-text {
      color: var(--text-secondary);
      font-size: 10px;
      line-height: 1.7;
    }

    .bottom-nav-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .bottom-nav {
      width: min(var(--container),100%);
      height: 82px;
      padding: 8px 25px calc(8px + env(safe-area-inset-bottom));
      background: var(--white);
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -7px 25px rgba(30,20,70,.07);
      display: grid;
      grid-template-columns: repeat(4,1fr);
      align-items: center;
      pointer-events: auto;
      transition: background .3s ease;
    }

    [data-theme="dark"] .bottom-nav {
      box-shadow: 0 -7px 25px rgba(0,0,0,.4);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #858693;
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
      height: 100%;
      transition: .2s ease;
      background: transparent;
    }

    [data-theme="dark"] .nav-item {
      color: #6b6b80;
    }

    .nav-item:hover {
      color: var(--primary);
    }

    .nav-icon {
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-item.active .nav-icon {
      width: 46px;
      height: 42px;
      border-radius: 15px;
      color: white;
      background: var(--primary);
      box-shadow: 0 7px 17px rgba(109,53,232,.28);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 102px;
      transform: translateX(-50%) translateY(12px);
      z-index: 9999;
      padding: 11px 18px;
      border-radius: 14px;
      background: #20202a;
      color: white;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      white-space: nowrap;
    }

    [data-theme="dark"] .toast {
      background: #f1f1f6;
      color: #1a1a2e;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width:700px) {
      .app { max-width:100%; }

      .hero {
        min-height:275px;
        padding:24px 20px;
      }

      .hero-content { width:60%; }
      .hero-title { font-size:25px; }
      .hero-subtitle { font-size:15px; }
      .hero-description { font-size:12px; }
      .hero-art { width:48%; left:-12px; }
      .hero-custom-icon { width: 140%; max-width: 300px; }

      .festival-card {
        grid-template-columns:58px 1fr;
        gap:12px;
        padding:14px;
      }

      .festival-icon {
        width:58px;
        height:58px;
      }

      .festival-actions {
        grid-column:2;
        flex-direction:row;
        align-items:center;
        justify-content:space-between;
        width:100%;
        margin-top:-2px;
      }

      .festival-title { font-size:15px; }
      .festival-description { font-size:11.5px; }
      .favorite-button { width:40px; height:40px; }
      .feature-card { padding:14px 8px; }
      .feature { padding:3px 6px; }
      .feature-title { font-size:11px; }
      .feature-text { font-size:9px; }
      .bottom-nav {
        padding-left:12px;
        padding-right:12px;
      }
    }

    @media (max-width:400px) {
      main { padding:0 14px; }
      .header { padding:0 14px; }
      .hero { min-height:290px; }
      .hero-content { width:62%; }
      .hero-art {
        opacity:.95;
        width:50%;
        left:-15px;
      }
      .hero-title { font-size:23px; }
      .hero-description { font-size:11px; }
      .hero-custom-icon { width: 140%; max-width: 250px; }
      .festival-card { grid-template-columns:54px 1fr; }
      .festival-icon {
        width:54px;
        height:54px;
      }
    }

    @supports (padding-bottom:env(safe-area-inset-bottom)) {
      .app {
        padding-bottom:calc(110px + env(safe-area-inset-bottom));
      }
    }
  </style>

</head>

<body>

<div class="app">

  <header class="header">

    <div class="header-side left">

      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="تغییر حالت روشن/تاریک"
        onclick="toggleTheme()"
      >
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2"/>
          <path d="M12 21v2"/>
          <path d="M4.22 4.22l1.42 1.42"/>
          <path d="M18.36 18.36l1.42 1.42"/>
          <path d="M1 12h2"/>
          <path d="M21 12h2"/>
          <path d="M4.22 19.78l1.42-1.42"/>
          <path d="M18.36 5.64l1.42-1.42"/>
        </svg>

        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

    </div>

    <div class="brand">

      <div class="netland-header-logo" aria-label="Net Land">
        <img 
          src="netland-logo.png"
          alt="Net Land Logo"
          class="netland-logo-svg"
          width="190"
          height="75"
        >
      </div>

    </div>

    <div class="header-side right">

      <button
        class="icon-button notification"
        aria-label="اعلان‌ها"

<script src="js/api-config.js"></script>

<script>
  const THEME_KEY = "netland_theme";

  function getStoredTheme() {
    try {
      return localStorage.getItem(THEME_KEY);
    } catch (e) {
      return null;
    }
  }

  function applyTheme(theme) {
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const newTheme = current === "dark" ? "light" : "dark";

    applyTheme(newTheme);

    try {
      localStorage.setItem(THEME_KEY, newTheme);
    } catch (e) {}

    const btn = document.getElementById("themeToggle");
    if (btn) {
      btn.style.transform = "scale(0.9) rotate(180deg)";
      setTimeout(() => {
        btn.style.transform = "";
      }, 250);
    }
  }

  (function initTheme() {
    const savedTheme = getStoredTheme();

    if (savedTheme === "dark") {
      applyTheme("dark");
    } else if (savedTheme === "light") {
      applyTheme("light");
    } else {
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (prefersDark) {
        applyTheme("dark");
      }
    }
  })();

  const UID_KEY = "netland_uid";

  function getOrCreateUserId() {
    let userId = localStorage.getItem(UID_KEY);

    if (!userId || typeof userId !== "string") {
      userId = "guest_" + crypto.randomUUID();
      localStorage.setItem(UID_KEY, userId);
    }

    return userId;
  }

  const FAVORITES_KEY = "netLandFavorites";

  function getLocalFavorites() {
    try {
      const saved = localStorage.getItem(FAVORITES_KEY);

      if (!saved) return [];

      const favorites = JSON.parse(saved);

      return Array.isArray(favorites) ? favorites : [];

    } catch (error) {
      return [];
    }
  }

  function saveLocalFavorites(favorites) {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
  }

  function toggleFavorite(button) {
    const card = button.closest(".festival-card");

    if (!card) return;

    const festivalId = card.dataset.id;
    const isActive = button.classList.contains("active");
    const favorites = getLocalFavorites();
    const index = favorites.indexOf(festivalId);

    if (index === -1) {
      favorites.push(festivalId);
      button.classList.add("active");
      showToast("به علاقه‌مندی‌ها اضافه شد ");
    } else {
      favorites.splice(index, 1);
      button.classList.remove("active");
      showToast("از علاقه‌مندی‌ها حذف شد");
    }

    saveLocalFavorites(favorites);
  }

  const COLORS = ['green', 'blue', 'pink', 'orange', 'red'];

  async function loadFestivals() {
    const list = document.getElementById('festivalList');

    list.innerHTML =
      '<div style="text-align:center;padding:20px;color:#6b7280;">در حال بارگذاری...</div>';

    try {
      const festivals = await getFestivals();

      const activeFestivals =
        festivals.filter(f => f.status === 'active');

      activeFestivals.sort((a, b) => {
        const dateA = a.createdAt
          ? new Date(a.createdAt).getTime()
          : 0;

        const dateB = b.createdAt
          ? new Date(b.createdAt).getTime()
          : 0;

        return dateB - dateA;
      });

      const latestFestivals =
        activeFestivals.slice(0, 3);

      console.log(
        '✅ تعداد جشنواره‌های فعال:',
        activeFestivals.length
      );

      console.log(
        '✅ نمایش ۳ جشنواره آخر:',
        latestFestivals.map(f => f.title)
      );

      if (latestFestivals.length === 0) {
        list.innerHTML =
          '<div style="text-align:center;padding:30px;color:#6b7280;">هیچ جشنواره فعالی وجود ندارد</div>';

        return;
      }

      renderFestivals(latestFestivals);

    } catch (error) {

      console.error(
        '❌ خطا در بارگذاری:',
        error
      );

      list.innerHTML =
        '<div style="text-align:center;padding:30px;color:#ef4444;">❌ خطا در بارگذاری جشنواره‌ها</div>';
    }
  }

  function renderFestivals(festivals) {

    const list =
      document.getElementById('festivalList');

    const favorites =
      getLocalFavorites();

    list.innerHTML =
      festivals.map((f, index) => {

        const isActive =
          favorites.includes(f.id);

        const colorIndex =
          index % COLORS.length;

        const color =
          COLORS[colorIndex];

        return `
          <article
            class="festival-card"
            data-id="${f.id}"
            data-type="${f.type || 'special'}"
            data-search="${f.title} ${f.badge} ${f.description || ''}"
            onclick="window.location.href='festival-detail.html?id=${f.id}'"
          >

            <div class="festival-icon ${color}">

              ${f.image
                ?
                `<img
                  src="${f.image}"
                  alt="${f.title}"
                  style="width:100%;height:100%;object-fit:cover;border-radius:18px;"
                >`
                :
                `<svg
                  width="31"
                  height="31"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="20 12 20 22 4 22 4 12"/>
                  <rect x="2" y="7" width="20" height="5" rx="1"/>
                  <line x1="12" y1="22" x2="12" y2="7"/>
                  <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                  <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                </svg>`
              }

            </div>

            <div class="festival-content">

              <h3 class="festival-title">
                ${f.title || 'بدون عنوان'}
              </h3>

              <p class="festival-description">
                ${f.description || f.information || ''}
              </p>

              <div class="festival-meta">

                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <path d="M16 2v4"/>
                  <path d="M8 2v4"/>
                  <path d="M3 10h18"/>
                </svg>

                <span>
                  ${f.meta || f.endDate || 'به زودی'}
                </span>

              </div>

            </div>

            <div class="festival-actions">

              <button
                class="favorite-button ${isActive ? 'active' : ''}"
                onclick="event.stopPropagation(); toggleFavorite(this)"
                aria-label="افزودن به علاقه‌مندی‌ها"
              >

                <svg
                  width="21"
                  height="21"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.6Z"/>
                </svg>

              </button>

              <button
                class="festival-action"
                onclick="event.stopPropagation(); window.location.href='festival-detail.html?id=${f.id}'"
              >
                مشاهده و شرکت

                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m15 18-6-6 6-6"/>
                </svg>

              </button>

            </div>

          </article>
        `;

      }).join('');
  }

  function showToast(message) {

    const oldToast =
      document.querySelector(".toast");

    if (oldToast) oldToast.remove();

    const toast =
      document.createElement("div");

    toast.className = "toast";
    toast.textContent = message;

    document.body.appendChild(toast);

    requestAnimationFrame(function() {
      toast.classList.add("show");
    });

    setTimeout(function() {

      toast.classList.remove("show");

      setTimeout(function() {

        if (toast.parentNode) {
          toast.remove();
        }

      }, 250);

    }, 1800);
  }

  const dots =
    document.querySelectorAll(".slider-dot");

  let currentDot = 0;

  if (dots.length > 1) {

    setInterval(function() {

      dots[currentDot].classList.remove("active");

      currentDot =
        (currentDot + 1) % dots.length;

      dots[currentDot].classList.add("active");

    }, 3500);
  }

  /* ================================
     اعلان‌ها - badge روی زنگوله
     (بر اساس زمان آخرین بازدید کاربر)
  ================================ */

  const LAST_SEEN_KEY = "netland_lastSeenNotificationAt";

  function toPersianDigits(value) {
    const digits = "۰۱۲۳۴۵۶۷۸۹";
    return String(value).replace(/\d/g, d => digits[d]);
  }

  async function fetchUnreadCount() {
    try {
      const res = await fetch(
        "https://net-land-api.zz4591757.workers.dev/api/notifications"
      );

      if (!res.ok) return 0;

      const data = await res.json();

      // خروجی API: { notifications: [ ... ] }
      const list =
        Array.isArray(data.notifications)
          ? data.notifications
          : [];

      if (list.length === 0) return 0;

      // زمان آخرین بازدید کاربر از صفحه اعلان‌ها
      let lastSeen = 0;
      try {
        lastSeen = parseInt(
          localStorage.getItem(LAST_SEEN_KEY) || "0",
          10
        ) || 0;
      } catch (e) {
        lastSeen = 0;
      }

      // اگه کاربر قبلاً هیچ‌وقت اعلان‌ها رو ندیده:
      // همه‌ی اعلان‌ها خونده‌نشده حساب میشن
      let unread = 0;

      list.forEach(item => {
        const created = item.createdAt
          ? new Date(item.createdAt).getTime()
          : 0;

        if (created > lastSeen) unread++;
      });

      return unread;

    } catch (error) {
      console.error("❌ خطا در شمارش اعلان‌ها:", error);
      return 0;
    }
  }

  async function updateNotificationBadge() {
    const badge =
      document.getElementById("notificationBadge");

    if (!badge) return;

    try {
      const count = await fetchUnreadCount();

      if (count > 0) {
        badge.textContent =
          toPersianDigits(count > 99 ? "99+" : count);
        badge.hidden = false;
      } else {
        badge.hidden = true;
        badge.textContent = "";
      }

    } catch (error) {
      console.error("خطا در بروزرسانی badge:", error);
      badge.hidden = true;
    }
  }

  function goToNotifications() {
    window.location.href = "notifications.html";
  }

  // وقتی کاربر از bfcache برگشت (back از notifications)
  window.addEventListener("pageshow", function () {
    updateNotificationBadge();
  });

  document.addEventListener(
    "DOMContentLoaded",
    function() {
      loadFestivals();
      updateNotificationBadge();
    }
  );
</script>
