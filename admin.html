<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت جشنواره‌ها | نت لند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#6d35e8;--primary-2:#8255f3;--primary-light:#f0ebff;--green:#25b96f;--green-light:#e9f9f0;--orange:#f3a623;--orange-light:#fff3dc;--bg:#f8f8fc;--white:#fff;--text:#20202a;--secondary:#6f7180;--muted:#999ba8;--border:#ececf3;--danger:#e55353;--danger-light:#fff0f0;--shadow:0 5px 18px rgba(40,30,80,.05);--radius:22px;--sm:15px;--max:1100px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:var(--max);margin:auto;min-height:100vh;padding-bottom:40px}
header{height:76px;background:#fff;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;position:sticky;top:0;z-index:10}.side{display:flex}.side.left{justify-content:flex-start}.side.right{justify-content:flex-end}.icon{width:44px;height:44px;border-radius:14px;background:transparent;color:#343441;display:grid;place-items:center}.icon:hover{background:#f5f3fa;color:var(--primary)}.brand{text-align:center}.brand-main{display:flex;justify-content:center;align-items:center;gap:7px;color:var(--primary);font-size:23px;font-weight:800;line-height:1}.brand-icon{width:27px;height:27px;border-radius:9px;background:linear-gradient(145deg,var(--primary),var(--primary-2));display:grid;place-items:center;overflow:hidden;box-shadow:0 5px 12px rgba(109,53,232,.25)}.brand-icon img{width:24px;height:24px;object-fit:contain}.brand-en{display:block;margin-top:5px;color:#777080;font:600 9px Arial;letter-spacing:1.3px;direction:ltr}
main{padding:0 20px}.heading{margin:24px 0 17px}.heading h1{font-size:23px;font-weight:800}.heading p{margin-top:5px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:16px}.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.ct{display:flex;align-items:center;gap:10px;margin-bottom:16px}.ci{width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center}.ci.green{background:var(--green-light);color:var(--green)}.ci.orange{background:var(--orange-light);color:var(--orange)}.ct h2{font-size:15px;font-weight:800}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}.req{color:var(--danger)}.input,.textarea,.select{width:100%;border:1px solid var(--border);outline:0;background:#fbfbfe;color:var(--text);border-radius:var(--sm);font-size:13px}.input,.select{height:48px;padding:0 14px}.textarea{min-height:145px;padding:13px 14px;resize:vertical;line-height:1.9}.input:focus,.textarea:focus,.select:focus{border-color:#c7b6f5;background:#fff;box-shadow:0 0 0 4px rgba(109,53,232,.07)}.hint{margin-top:6px;color:var(--muted);font-size:10.5px;line-height:1.7}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.image-row{display:grid;grid-template-columns:125px 1fr;gap:14px;align-items:center}.preview{width:125px;height:125px;border-radius:22px;background:var(--primary-light);border:1px solid #e7dcfb;display:grid;place-items:center;overflow:hidden;color:var(--primary);text-align:center;font-size:10px;line-height:1.7}.preview img{display:none;width:100%;height:100%;object-fit:cover}.preview.has img{display:block}.preview.has span{display:none}.buttons{display:flex;flex-wrap:wrap;gap:8px}.upload,.secondary,.primary,.danger{min-height:43px;padding:0 14px;border-radius:12px;font-size:11px;font-weight:700}.upload,.primary{background:var(--primary);color:#fff}.secondary{background:#f3f1f8;color:var(--secondary)}.file{display:none}
.duration{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{min-height:54px;border:1px solid var(--border);border-radius:14px;background:#fbfbfe;color:var(--secondary);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:600;cursor:pointer;margin:0}.choice input:checked+label{background:var(--primary-light);border-color:#cdbbf6;color:var(--primary)}.status .choice input:checked+label{background:var(--green-light);border-color:#bdebd3;color:var(--green)}.status .off input:checked+label{background:var(--danger-light);border-color:#f0c7c7;color:var(--danger)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.primary,.secondary{height:52px;border-radius:15px;font-size:13px}.primary{background:linear-gradient(145deg,var(--primary),var(--primary-2));box-shadow:0 10px 22px rgba(109,53,232,.18)}.secondary{background:#f3f2f7}
.list{display:flex;flex-direction:column;gap:10px}.item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:11px;align-items:center;border:1px solid var(--border);background:#fcfcfe;border-radius:17px;padding:11px}.thumb{width:58px;height:58px;border-radius:15px;background:var(--primary-light);display:grid;place-items:center;overflow:hidden;color:var(--primary)}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.badge{font-size:9px;font-weight:600;padding:4px 7px;border-radius:8px;background:var(--primary-light);color:var(--primary)}.badge.active{background:var(--green-light);color:var(--green)}.badge.off{background:var(--danger-light);color:var(--danger)}.item-actions{display:flex;gap:6px}.small{width:37px;height:37px;border-radius:11px;background:#f1eff7;color:var(--secondary);display:grid;place-items:center}.small:hover{background:var(--primary-light);color:var(--primary)}.small.del:hover{background:var(--danger-light);color:var(--danger)}.empty{padding:25px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.9;border:1px dashed #ddd9e7;border-radius:16px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,12px);background:#20202a;color:#fff;padding:11px 18px;border-radius:14px;font-size:12px;opacity:0;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.grid{grid-template-columns:1fr}}@media(max-width:600px){main{padding:0 14px}.image-row{grid-template-columns:1fr}.preview{margin:auto}.two{grid-template-columns:1fr}.item{grid-template-columns:54px minmax(0,1fr)}.item-actions{grid-column:1/-1;justify-content:flex-end}}@media(max-width:400px){.duration{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}

/* ===== پشتیبانی ===== */
.support-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.support-item{border:1px solid var(--border);background:#fcfcfe;border-radius:17px;padding:13px}
.support-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.support-user{font-size:12px;font-weight:800}
.support-date{font-size:9px;color:var(--muted)}
.support-message{margin-top:9px;color:var(--secondary);font-size:12px;line-height:1.9;white-space:pre-line}
.reply-box{margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}
.reply-text{width:100%;min-height:75px;padding:10px 12px;border:1px solid var(--border);border-radius:13px;background:#fff;outline:0;resize:vertical;font-size:12px;line-height:1.8}
.reply-text:focus{border-color:#c7b6f5;box-shadow:0 0 0 4px rgba(109,53,232,.07)}
.reply-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.reply-button{height:38px;padding:0 13px;border-radius:11px;background:var(--primary);color:#fff;font-size:11px;font-weight:700}
.reply-button:hover{background:var(--primary-2)}
.admin-reply{margin-top:9px;padding:10px 11px;border-radius:12px;background:var(--primary-light);color:#55418a;font-size:11px;line-height:1.8;white-space:pre-line}
.support-count{min-width:24px;height:24px;padding:0 7px;border-radius:9px;background:var(--orange-light);color:#b77800;display:inline-grid;place-items:center;font-size:10px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header>
<div class="side left"><button class="icon" onclick="back()">‹</button></div>
<div class="brand"><div class="brand-main"><span>نت لند</span><span class="brand-icon"><img src="netland-icon-2.png" alt=""></span></div><span class="brand-en">Net Land</span></div>
<div class="side right"><button class="icon" onclick="newFestival()">＋</button></div>
</header>

<main>
<div class="heading"><h1>مدیریت جشنواره‌ها</h1><p>فیلدهای این پنل دقیقاً با صفحه اطلاعات جشنواره هماهنگ هستند.</p></div>

<div class="grid">
<section>
<!-- ===== فرم جشنواره ===== -->
<div class="card">
<div class="ct"><span class="ci">▣</span><h2>اطلاعات جشنواره</h2></div>
<div class="field"><label for="title">عنوان <span class="req">*</span></label><input id="title" class="input" placeholder="عنوان جشنواره"></div>
<div class="field"><label>تصویر</label>
<div class="image-row">
<div id="preview" class="preview"><img id="previewImg" alt=""><span>تصویر</span></div>
<div>
<div class="field"><label for="imageUrl">آدرس تصویر</label><input id="imageUrl" class="input" dir="ltr" type="url" placeholder="https://..."></div>
<div class="buttons"><label class="upload" for="imageFile">انتخاب</label><input id="imageFile" class="file" type="file" accept="image/*"><button class="secondary" onclick="removeImage()">حذف</button></div>
</div></div></div>
</div>

<div class="card">
<div class="ct"><span class="ci">◷</span><h2>مدت زمان</h2></div>
<div class="duration">
<div class="choice"><input id="dDate" name="duration" type="radio" value="date" checked><label for="dDate">تا تاریخ</label></div>
<div class="choice"><input id="dUnknown" name="duration" type="radio" value="unknown"><label for="dUnknown">نامعلوم</label></div>
<div class="choice"><input id="dLimited" name="duration" type="radio" value="limited"><label for="dLimited">محدود</label></div>
</div>
<div id="dateWrap" class="field" style="margin-top:12px"><label for="endDate">تاریخ پایان</label><input id="endDate" class="input" type="date"></div>
</div>

<div class="card">
<div class="ct"><span class="ci green">ⓘ</span><h2>اطلاعات</h2></div>
<div class="field"><label for="information">توضیحات <span class="req">*</span></label><textarea id="information" class="textarea" placeholder="توضیحات..."></textarea></div>
</div>

<div class="card">
<div class="ct"><span class="ci orange">▣</span><h2>کد و لینک</h2></div>
<div class="two">
<div class="field"><label for="referral">کد معرف</label><input id="referral" class="input" dir="ltr" placeholder="NETLAND123"></div>
<div class="field"><label for="joinUrl">لینک شرکت <span class="req">*</span></label><input id="joinUrl" class="input" dir="ltr" type="url" placeholder="https://..."></div>
</div>
</div>

<div class="card">
<div class="ct"><span class="ci">✓</span><h2>وضعیت</h2></div>
<div class="status">
<div class="choice"><input id="active" name="status" type="radio" value="active" checked><label for="active">فعال</label></div>
<div class="choice off"><input id="inactive" name="status" type="radio" value="inactive"><label for="inactive">غیرفعال</label></div>
</div>
<div class="actions"><button class="primary" onclick="saveFestival()" id="saveBtn">ذخیره</button><button class="secondary" onclick="newFestival()">پاک کردن</button></div>
</div>
</section>

<aside>
<!-- ===== لیست جشنواره‌ها ===== -->
<div class="card">
<div class="ct"><span class="ci">☷</span><h2>لیست جشنواره‌ها</h2></div>
<div id="list" class="list"></div>
</div>

<!-- ===== پشتیبانی ===== -->
<div class="card">
<div class="ct"><span class="ci orange">✉</span><h2>پشتیبانی <span id="supportCount" class="support-count">0</span></h2></div>
<div class="support-note" style="padding:11px 12px;border-radius:13px;background:#faf9ff;border:1px solid #eee9fb;color:var(--muted);font-size:10.5px;line-height:1.8;margin-bottom:11px;">
  پیام‌های کاربران اینجا نمایش داده می‌شوند. پاسخ شما در همان گفت‌وگو ذخیره می‌شود.
</div>
<div id="supportList" class="support-list"></div>
</div>
</aside>
</div>
</main>
</div>
<div id="toast" class="toast"></div>

<!-- ===== API Config (اتصال به Cloudflare Worker) ===== -->
<script src="js/api-config.js"></script>

<script>
// ============================================
// ===== پنل مدیریت - Cloudflare Worker =====
// ============================================

let editingId = null;
let currentImage = "";
let allFestivals = [];
let supportMessages = [];
const $ = id => document.getElementById(id);

// ============================================
// ===== جشنواره‌ها =====
// ============================================

async function loadFestivals() {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty">در حال بارگذاری...</div>';

  try {
    allFestivals = await getFestivals();
    
    // مرتب‌سازی بر اساس تاریخ (جدیدترین اول)
    allFestivals.sort((a, b) => {
      const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
      const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
      return dateB - dateA;
    });

    if (allFestivals.length === 0) {
      list.innerHTML = '<div class="empty">هنوز جشنواره‌ای ثبت نشده است.</div>';
      return;
    }

    list.innerHTML = allFestivals.map(f => {
      const isActive = f.status === 'active';
      return `
      <div class="item" data-id="${f.id}">
        <div class="thumb">${f.image ? `<img src="${f.image}" alt="">` : '🎯'}</div>
        <div>
          <div class="name">${f.title || 'بدون عنوان'}</div>
          <div class="meta">
            <span class="badge">${f.durationType || 'نامعلوم'}</span>
            <span class="badge ${isActive ? 'active' : 'off'}">${isActive ? 'فعال' : 'غیرفعال'}</span>
          </div>
        </div>
        <div class="item-actions">
          <button class="small" onclick="editFestival('${f.id}')">✎</button>
          <button class="small del" onclick="deleteFestival('${f.id}')">×</button>
        </div>
      </div>
    `}).join('');

  } catch(e) {
    console.error('❌ خطا:', e);
    list.innerHTML = '<div class="empty">خطا در بارگذاری</div>';
  }
}

// ===== گرفتن داده فرم =====
function getFormData() {
  const type = document.querySelector('input[name="duration"]:checked')?.value || 'unknown';
  const statusVal = document.querySelector('input[name="status"]:checked')?.value || 'active';
  const iconMap = { date: 'purple', unknown: 'blue', limited: 'orange' };

  return {
    title: $('title').value.trim(),
    image: currentImage || $('imageUrl').value.trim(),
    durationType: type,
    endDate: $('endDate').value,
    information: $('information').value.trim(),
    referralCode: $('referral').value.trim(),
    joinUrl: $('joinUrl').value.trim(),
    status: statusVal,
    badge: statusVal === 'active' ? 'ویژه' : 'غیرفعال',
    type: type === 'date' ? 'special' : type,
    icon: iconMap[type] || 'purple',
    meta: type === 'date' ? $('endDate').value : (type === 'limited' ? 'محدود' : 'نامعلوم'),
    description: $('information').value.trim().substring(0, 60) + '...'
  };
}

// ===== ذخیره جشنواره از طریق Worker =====
// ===== ذخیره جشنواره از طریق Worker =====
async function saveFestival() {
  const data = getFormData();
  console.log('📋 داده:', data);

  if (!data.title) return toast('❌ عنوان را وارد کن');
  if (data.durationType === 'date' && !data.endDate) return toast('❌ تاریخ پایان را انتخاب کن');
  if (!data.information) return toast('❌ توضیحات را وارد کن');
  if (!data.joinUrl) return toast('❌ لینک شرکت را وارد کن');
  try { new URL(data.joinUrl); } catch { return toast('❌ لینک شرکت معتبر نیست'); }

  try {
    const payload = { ...data, updatedAt: new Date().toISOString() };

    let url, method;
    if (editingId) {
      url = `${API_BASE_URL}/api/festival/${editingId}`;
      method = 'PUT';
    } else {
      payload.createdAt = new Date().toISOString();
      url = `${API_BASE_URL}/api/festivals`;
      method = 'POST';
    }

    console.log('📡 ارسال به:', url);
    console.log('📦 payload:', payload);

    const response = await fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    console.log('📊 وضعیت:', response.status);

    // ===== دریافت پاسخ به صورت متن =====
    const text = await response.text();
    console.log('📄 پاسخ خام:', text);

    let result;
    try {
      result = JSON.parse(text);
    } catch(e) {
      result = { error: 'پاسخ نامعتبر: ' + text.substring(0, 100) };
    }

    console.log('📄 نتیجه:', result);

    if (response.ok) {
      toast(editingId ? '✅ جشنواره ویرایش شد!' : '✅ جشنواره اضافه شد!');
      newFestival();
      setTimeout(async () => { await loadFestivals(); }, 500);
    } else {
      throw new Error(result.error || result.message || 'خطا در ذخیره');
    }

  } catch(e) {
    console.error('❌ خطا:', e);
    toast('❌ خطا: ' + e.message);
  }
}

// ===== حذف جشنواره از طریق Worker =====
async function deleteFestival(id) {
  if (!confirm('جشنواره حذف شود؟')) return;
  try {
    // حذف از طریق Worker
    const response = await fetch(`${API_BASE_URL}/api/festival/${id}`, {
      method: 'DELETE'
    });
    const result = await response.json();
    if (response.ok) {
      toast('🗑️ جشنواره حذف شد!');
      await loadFestivals();
    } else {
      throw new Error(result.error || 'خطا در حذف');
    }
  } catch(e) {
    console.error('❌ خطا در حذف:', e);
    toast('❌ خطا در حذف: ' + e.message);
  }
}

// ===== فرم جدید =====
function newFestival() {
  editingId = null;
  ['title','imageUrl','information','referral','joinUrl','endDate'].forEach(id => $(id).value = '');
  currentImage = '';
  removeImage();
  document.querySelector('input[name="duration"][value="date"]').checked = true;
  document.querySelector('input[name="status"][value="active"]').checked = true;
  $('saveBtn').textContent = 'ذخیره جشنواره';
  updateDate();
}

// ===== تصویر =====
$('imageFile').addEventListener('change', e => {
  const f = e.target.files?.[0];
  if (!f) return;
  if (!f.type.startsWith('image/')) return toast('فایل تصویری انتخاب کن');
  const r = new FileReader();
  r.onload = () => { currentImage = r.result; $('imageUrl').value = ''; previewImage(currentImage); };
  r.readAsDataURL(f);
});

$('imageUrl').addEventListener('input', e => {
  if (e.target.value.trim()) { currentImage = e.target.value.trim(); previewImage(currentImage); }
});

function previewImage(src) {
  const img = $('previewImg');
  const preview = $('preview');
  if (src) { img.src = src; preview.classList.add('has'); }
  else { img.src = ''; preview.classList.remove('has'); }
}

function removeImage() {
  currentImage = '';
  $('imageUrl').value = '';
  $('imageFile').value = '';
  previewImage('');
}

function duration(){ return document.querySelector('input[name="duration"]:checked')?.value || 'unknown'; }
function updateDate(){ $('dateWrap').style.display = duration() === 'date' ? 'block' : 'none'; }
document.querySelectorAll('input[name="duration"]').forEach(x => x.addEventListener('change', updateDate));

// ============================================
// ===== پشتیبانی =====
// ============================================

async function loadSupport() {
  const list = document.getElementById('supportList');
  const count = document.getElementById('supportCount');
  list.innerHTML = '<div class="empty">در حال بارگذاری پیام‌ها...</div>';

  try {
    supportMessages = await getSupportMessages();
    
    // مرتب‌سازی بر اساس تاریخ (جدیدترین اول)
    supportMessages.sort((a, b) => {
      const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
      const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
      return dateB - dateA;
    });

    // ===== تعداد پیام‌های بدون پاسخ =====
    const unread = supportMessages.filter(x => !x.reply || x.reply.trim() === '').length;
    count.textContent = unread;

    if (supportMessages.length === 0) {
      list.innerHTML = '<div class="empty">هنوز پیامی از کاربران دریافت نشده است.</div>';
      return;
    }

    // ===== نمایش همه پیام‌ها (حتی اونایی که پاسخ دارن) =====
    list.innerHTML = supportMessages.map((x, i) => {
      const isReplied = x.reply && x.reply.trim() !== '';
      
      return `
      <div class="support-item" data-index="${i}">
        <div class="support-top">
          <div class="support-user">${x.username || 'کاربر نت لند'}</div>
          <div class="support-date">${x.createdAt ? new Date(x.createdAt).toLocaleString('fa-IR') : ''}</div>
        </div>
        <div class="meta">
          <span class="badge ${isReplied ? 'active' : 'off'}">${isReplied ? '✅ پاسخ داده شده' : '⏳ بدون پاسخ'}</span>
          <span style="font-size:8px;color:var(--muted);">شناسه: ${x.userId?.substring(0,8) || ''}</span>
        </div>
        <div class="support-message">${x.message || ''}</div>
        
        ${isReplied ? `
          <div class="admin-reply"><b>پاسخ شما:</b><br>${x.reply}</div>
        ` : ''}
        
        <div class="reply-box">
          <textarea id="reply_${i}" class="reply-text" placeholder="پاسخ خود را بنویس...">${x.reply || ''}</textarea>
          <div class="reply-actions">
            <span class="support-date">کاربر: ${x.username || 'ناشناس'}</span>
            <button class="reply-button" onclick="replySupport(${i})">${isReplied ? '✏️ ویرایش پاسخ' : '📨 ارسال پاسخ'}</button>
          </div>
        </div>
      </div>
    `}).join('');

  } catch(e) {
    console.warn('⚠️ خطا:', e);
    list.innerHTML = '<div class="empty">خطا در بارگذاری</div>';
  }
}

async function replySupport(index) {
  const item = supportMessages[index];
  if (!item) {
    toast('❌ پیام پیدا نشد');
    return;
  }
  
  const text = document.getElementById('reply_' + index).value.trim();
  if (!text) return toast('❌ متن پاسخ را وارد کن');

  try {
    // ===== ارسال پاسخ =====
    const response = await fetch(`${API_BASE_URL}/api/support/${item.id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reply: text,
        repliedAt: new Date().toISOString(),
        repliedBy: 'admin',
        status: 'answered',
        isAdmin: true,
        userId: item.userId
      })
    });
    
    const result = await response.json();
    
    if (response.ok) {
      toast('✅ پاسخ با موفقیت ثبت شد!');
      
      // ===== به‌روزرسانی محلی =====
      item.reply = text;
      item.isAdmin = true;
      item.status = 'answered';
      item.repliedBy = 'admin';
      
      // ===== فقط همین آیتم رو آپدیت کن =====
      const itemEl = document.querySelector(`.support-item[data-index="${index}"]`);
      if (itemEl) {
        // ۱. به‌روزرسانی Badge
        const badge = itemEl.querySelector('.badge');
        if (badge) {
          badge.textContent = '✅ پاسخ داده شده';
          badge.className = 'badge active';
        }
        
        // ۲. اضافه کردن پاسخ ادمین
        let adminReply = itemEl.querySelector('.admin-reply');
        if (adminReply) {
          adminReply.innerHTML = `<b>پاسخ شما:</b><br>${text}`;
          adminReply.style.display = 'block';
        } else {
          // اگه وجود نداره، بسازش
          const supportMessage = itemEl.querySelector('.support-message');
          const newAdminReply = document.createElement('div');
          newAdminReply.className = 'admin-reply';
          newAdminReply.innerHTML = `<b>پاسخ شما:</b><br>${text}`;
          if (supportMessage) {
            supportMessage.after(newAdminReply);
          }
        }
        
        // ۳. به‌روزرسانی دکمه
        const replyButton = itemEl.querySelector('.reply-button');
        if (replyButton) {
          replyButton.textContent = '✏️ ویرایش پاسخ';
        }
      }
      
      // ===== بروزرسانی تعداد =====
      const unread = supportMessages.filter(x => !x.reply || x.reply.trim() === '').length;
      document.getElementById('supportCount').textContent = unread;
      
    } else {
      throw new Error(result.error || 'خطا در ارسال پاسخ');
    }

  } catch(e) {
    console.warn('⚠️ خطا:', e);
    toast('❌ خطا در ارسال پاسخ: ' + e.message);
  }
}

// ===== Toast =====
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function back() {
  history.length > 1 ? history.back() : location.href = 'index.html';
}
